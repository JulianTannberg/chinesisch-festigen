<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nachzeichnen · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chinesisch" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
  <style>
    /* Nur fürs Nachzeichnen – fügt sich in dein bestehendes Theme ein */
    .traceWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }
    .traceInfo{ text-align:center; min-height:54px; }
    .traceInfo .zhBig{ font-size:24px; font-weight:850; opacity:.55; letter-spacing:4px; }
    .traceInfo .pinyin{ font-size:20px; font-weight:700; opacity:.95; }
    .traceInfo .de{ font-size:15px; opacity:.8; }
    #traceTarget{
      background:#fff;
      border-radius:18px;
      box-shadow:0 10px 30px var(--shadow);
      /* Hilfslinien: exakt mittiges Kreuz */
      background-image:
        linear-gradient(to right, transparent calc(50% - 0.75px), rgba(0,0,0,.13) calc(50% - 0.75px), rgba(0,0,0,.13) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
        linear-gradient(to bottom, transparent calc(50% - 0.75px), rgba(0,0,0,.13) calc(50% - 0.75px), rgba(0,0,0,.13) calc(50% + 0.75px), transparent calc(50% + 0.75px));
      background-size:100% 100%;
      background-repeat:no-repeat;
      background-position:center center;
      touch-action:none;
      width:280px;
      height:280px;
    }
    #traceTarget{ position:relative; overflow:hidden; }
    #traceTarget .traceLayer{
      position:absolute;
      inset:0;
      width:280px;
      height:280px;
    }
    #traceQuizLayer{ z-index:1; }
    #traceHintLayer{ z-index:2; pointer-events:none; }
    .traceStatus{ min-height:26px; font-weight:800; font-size:16px; }
    .traceStatus.ok{ color:#86efac; }
    .traceStatus.bad{ color:#fecaca; }
    .traceBtns{ display:flex; gap:10px; width:100%; max-width:300px; }
    .traceBtns button{ flex:1; min-height:48px; }
    .traceBtns .primary{ background:var(--card-strong); outline:2px solid rgba(255,255,255,.28); }
    .traceNav{
      display:flex; align-items:center; justify-content:space-between;
      width:100%; max-width:300px;
    }
    .traceNav button{
      width:50px; height:50px; border-radius:50%; font-size:22px; padding:0;
    }
    .traceCounter{ font-size:14px; color:var(--muted); }
    .autoRow{
      display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted);
      margin-top:2px;
    }
    .autoRow input{ width:18px; height:18px; }

    .writeTabs{ grid-template-columns:1fr 1fr; }
    @media(max-width:640px){
      .writeTabs{ grid-template-columns:1fr 1fr; }
      .writeTabs .tab{ min-height:46px; font-size:14px; padding:8px 6px; }
    }
    .traceLevelSwitch{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      width:100%;
      max-width:560px;
      margin:0 0 4px;
    }
    .traceLevelSwitch button{
      min-height:44px;
      padding:9px 8px;
      font-size:13px;
      line-height:1.2;
      white-space:normal;
    }
    .traceLevelSwitch button.active{
      background:var(--card-strong);
      outline:2px solid rgba(255,255,255,.28);
    }
    .traceHelpText{
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
      text-align:center;
      max-width:560px;
      min-height:34px;
      margin-bottom:4px;
    }
    .traceWordGuide{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:7px;
      margin:0 0 8px;
      max-width:560px;
    }
    .traceWordGuide .traceSyllable{
      min-width:48px;
      padding:7px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:14px;
      font-weight:800;
      text-align:center;
      line-height:1.15;
    }
    .traceWordGuide .traceSyllable.done{
      opacity:.55;
    }
    .traceWordGuide .traceSyllable.active{
      background:var(--card-strong);
      outline:2px solid rgba(255,255,255,.30);
      opacity:1;
      transform:translateY(-1px);
    }
    .traceWordGuide .traceSyllable small{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" id="back">← Kapitel</a>
    </div>
    <h1 id="title">Nachzeichnen</h1>
    <p class="subtitle">Zeichne die Vokabeln Strich für Strich nach. Such dir oben aus, wie viel Hilfe du möchtest.</p>

    <section class="card">
        <div id="traceEmpty" class="empty" style="display:none;">Für dieses Kapitel sind noch keine Vokabeln zum Nachzeichnen eingetragen.</div>

        <div class="traceWrap" id="traceWrap">
          <div class="traceLevelSwitch" aria-label="Schwierigkeit beim Nachzeichnen">
            <button id="traceLevelBeginner" type="button">Anfänger</button>
            <button id="traceLevelGuided" type="button">Mit Zeichen</button>
            <button id="traceLevelPro" type="button">Profi</button>
          </div>
          <div class="traceHelpText" id="traceHelpText"></div>

          <div class="traceInfo">
            <div class="traceWordGuide" id="traceWordGuide"></div>
            <div class="pinyin" id="tracePinyin">–</div>
            <div class="de" id="traceDe">–</div>
          </div>

          <div id="traceTarget"></div>

          <div class="traceStatus" id="traceStatus">&nbsp;</div>

          <div class="traceBtns">
            <button id="traceShow" type="button">Zeig mir</button>
            <button id="traceStart" type="button" class="primary">Neu üben</button>
          </div>

          <div class="autoRow">
            <input type="checkbox" id="traceAuto" />
            <label for="traceAuto">Nach jedem Wort automatisch weiter</label>
          </div>

          <div class="traceNav">
            <button id="tracePrev" type="button">‹</button>
            <span class="traceCounter" id="traceCounter">1 / 1</span>
            <button id="traceNext" type="button">›</button>
          </div>
        </div>
    </section>
  </main>

<script src="topics.js"></script>
<script src="common.js"></script>
<script>
const topic = getTopic();
applyTheme(topic, "Nachzeichnen");
const $ = id => document.getElementById(id);
$("back").href = `kapitel.html?id=${topic.id}`;
$("title").textContent = `${topic.id}. ${topic.title} · Nachzeichnen`;

/* ============================================================
   TEIL 2: NACHZEICHNEN  (Hanzi Writer)
   ============================================================ */
// Nachzeichnen läuft wortweise in der Reihenfolge der Vokabelliste.
// Schwierigkeitsstufen:
// Anfänger: Strich für Strich ansehen und direkt danach nachzeichnen.
// Mit Zeichen: direkt mit Zeichen/Vorlage im Hintergrund schreiben.
// Profi: ohne Vorlage; nach drei Fehlern erscheint Hilfe mit Zeichen.
const traceWords = (topic.vocab || [])
  .filter(v => /[\u4e00-\u9fff]/.test(v.zh || ""))
  .map((v, wordIndex) => ({
    wordIndex,
    zh: v.writeZh || v.zh || "",
    pinyin: v.writePinyin || v.pinyin || "",
    de: v.writeDe || v.de || "",
    chars: [...String(v.writeZh || v.zh || "")].filter(c => /[\u4e00-\u9fff]/.test(c))
  }))
  .filter(w => w.chars.length > 0);

const accentHex = topic.accent || "#03172B";
const TRACE_LEVELS = {
  beginner: {
    label: "Anfänger",
    help: "Strich für Strich: Erst wird ein Strich gezeigt, dann zeichnest du genau diesen Strich nach.",
    showOutline: true,
    showCharacter: false,
    autoAnimate: false,
    hintAfter: 1,
    leniency: 1.25
  },
  guided: {
    label: "Mit Zeichen",
    help: "Schreibe mit dem Zeichen im Hintergrund. „Zeig mir“ hilft jederzeit.",
    showOutline: true,
    showCharacter: true,
    autoAnimate: false,
    hintAfter: 2,
    leniency: 1.15
  },
  pro: {
    label: "Profi",
    help: "Schreibe ohne Vorlage. Nach drei Fehlern erscheint das Zeichen als Hilfe.",
    showOutline: false,
    showCharacter: false,
    autoAnimate: false,
    hintAfter: 3,
    leniency: 1.0
  }
};

let tWordIndex = 0;
let tCharPos = 0;
let tWriter = null;
let traceInited = false;
let traceQuizToken = 0;
let traceLevel = localStorage.getItem(`cf_trace_level_${topic.id}`) || "beginner";
if(!TRACE_LEVELS[traceLevel]) traceLevel = "beginner";
let proFallback = false;
let currentMistakes = 0;
let traceRepeat = false;
let beginnerCompletedStrokes = 0;
let autoNext = localStorage.getItem(`cf_trace_auto_${topic.id}`) !== "0"; // Standard: automatisch weiter

function setTraceStatus(text, kind){
  const el = $("traceStatus");
  el.textContent = text || "\u00A0";
  el.className = "traceStatus" + (kind ? " " + kind : "");
}
function currentTraceWord(){ return traceWords[tWordIndex]; }
function currentTraceChar(){
  const word = currentTraceWord();
  return word ? word.chars[tCharPos] : null;
}
const PINYIN_BASES = new Set([
  "a","ai","an","ang","ao","ba","bai","ban","bang","bao","bei","ben","beng","bi","bian","biao","bie","bin","bing","bo","bu",
  "ca","cai","can","cang","cao","ce","cen","ceng","cha","chai","chan","chang","chao","che","chen","cheng","chi","chong","chou","chu","chua","chuai","chuan","chuang","chui","chun","chuo","ci","cong","cou","cu","cuan","cui","cun","cuo",
  "da","dai","dan","dang","dao","de","dei","den","deng","di","dia","dian","diao","die","ding","diu","dong","dou","du","duan","dui","dun","duo",
  "e","ei","en","eng","er","fa","fan","fang","fei","fen","feng","fo","fou","fu",
  "ga","gai","gan","gang","gao","ge","gei","gen","geng","gong","gou","gu","gua","guai","guan","guang","gui","gun","guo",
  "ha","hai","han","hang","hao","he","hei","hen","heng","hong","hou","hu","hua","huai","huan","huang","hui","hun","huo",
  "ji","jia","jian","jiang","jiao","jie","jin","jing","jiong","jiu","ju","juan","jue","jun",
  "ka","kai","kan","kang","kao","ke","ken","keng","kong","kou","ku","kua","kuai","kuan","kuang","kui","kun","kuo",
  "la","lai","lan","lang","lao","le","lei","leng","li","lia","lian","liang","liao","lie","lin","ling","liu","lo","long","lou","lu","lv","luan","lve","lun","luo",
  "ma","mai","man","mang","mao","me","mei","men","meng","mi","mian","miao","mie","min","ming","miu","mo","mou","mu",
  "na","nai","nan","nang","nao","ne","nei","nen","neng","ni","nian","niang","niao","nie","nin","ning","niu","nong","nou","nu","nv","nuan","nve","nun","nuo",
  "o","ou","pa","pai","pan","pang","pao","pei","pen","peng","pi","pian","piao","pie","pin","ping","po","pou","pu",
  "qi","qia","qian","qiang","qiao","qie","qin","qing","qiong","qiu","qu","quan","que","qun",
  "ran","rang","rao","re","ren","reng","ri","rong","rou","ru","rua","ruan","rui","run","ruo",
  "sa","sai","san","sang","sao","se","sen","seng","sha","shai","shan","shang","shao","she","shei","shen","sheng","shi","shou","shu","shua","shuai","shuan","shuang","shui","shun","shuo","si","song","sou","su","suan","sui","sun","suo",
  "ta","tai","tan","tang","tao","te","teng","ti","tian","tiao","tie","ting","tong","tou","tu","tuan","tui","tun","tuo",
  "wa","wai","wan","wang","wei","wen","weng","wo","wu",
  "xi","xia","xian","xiang","xiao","xie","xin","xing","xiong","xiu","xu","xuan","xue","xun",
  "ya","yan","yang","yao","ye","yi","yin","ying","yo","yong","you","yu","yuan","yue","yun",
  "za","zai","zan","zang","zao","ze","zei","zen","zeng","zha","zhai","zhan","zhang","zhao","zhe","zhei","zhen","zheng","zhi","zhong","zhou","zhu","zhua","zhuai","zhuan","zhuang","zhui","zhun","zhuo","zi","zong","zou","zu","zuan","zui","zun","zuo"
]);
const TONE_MAP = {"ā":"a","á":"a","ǎ":"a","à":"a","ē":"e","é":"e","ě":"e","è":"e","ī":"i","í":"i","ǐ":"i","ì":"i","ō":"o","ó":"o","ǒ":"o","ò":"o","ū":"u","ú":"u","ǔ":"u","ù":"u","ǖ":"v","ǘ":"v","ǚ":"v","ǜ":"v","ü":"v","Ā":"a","Á":"a","Ǎ":"a","À":"a","Ē":"e","É":"e","Ě":"e","È":"e","Ī":"i","Í":"i","Ǐ":"i","Ì":"i","Ō":"o","Ó":"o","Ǒ":"o","Ò":"o","Ū":"u","Ú":"u","Ǔ":"u","Ù":"u","Ǖ":"v","Ǘ":"v","Ǚ":"v","Ǜ":"v","Ü":"v"};
function stripPinyin(s){
  return [...String(s || "")].map(ch => TONE_MAP[ch] || ch.toLowerCase()).join("").replace(/[^a-zv]/g, "");
}
function splitPinyinToken(token, slots){
  const raw = String(token || "").trim();
  if(!raw) return [];
  if(slots <= 1) return [raw];
  const chars = [...raw].filter(ch => /[A-Za-zĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüÜ]/.test(ch));
  const n = chars.length;
  const memo = new Map();
  function rec(pos, left){
    const key = pos + ":" + left;
    if(memo.has(key)) return memo.get(key);
    if(left === 0) return pos === n ? [] : null;
    for(let end = pos + 1; end <= n; end++){
      const piece = chars.slice(pos, end).join("");
      const base = stripPinyin(piece);
      if(!PINYIN_BASES.has(base)) continue;
      const rest = rec(end, left - 1);
      if(rest){
        const result = [piece, ...rest];
        memo.set(key, result);
        return result;
      }
    }
    memo.set(key, null);
    return null;
  }
  return rec(0, slots) || [raw];
}
function splitPinyinForChars(pinyin, charCount){
  const tokens = String(pinyin || "").replace(/[。！？!?，,、；;：:]/g, " ").trim().split(/\s+/).filter(Boolean);
  if(!charCount) return [];
  if(tokens.length === charCount) return tokens;
  if(tokens.length === 0) return Array.from({length: charCount}, (_, i) => `Zeichen ${i + 1}`);
  const out = [];
  function rec(tokenIndex, slotsLeft){
    if(tokenIndex === tokens.length){ return slotsLeft === 0 ? [] : null; }
    const remainingTokens = tokens.length - tokenIndex - 1;
    const maxSlots = slotsLeft - remainingTokens;
    for(let slots = 1; slots <= maxSlots; slots++){
      const parts = splitPinyinToken(tokens[tokenIndex], slots);
      if(parts.length !== slots && slots !== 1) continue;
      const rest = rec(tokenIndex + 1, slotsLeft - parts.length);
      if(rest) return [...parts, ...rest];
    }
    return null;
  }
  const parts = rec(0, charCount);
  if(parts && parts.length === charCount) return parts;
  return Array.from({length: charCount}, (_, i) => tokens[i] || tokens[tokens.length - 1] || `Zeichen ${i + 1}`);
}
function tracePinyinParts(word){
  if(!word) return [];
  if(Array.isArray(word.pinyinParts) && word.pinyinParts.length === word.chars.length) return word.pinyinParts;
  return splitPinyinForChars(word.pinyin || "", word.chars.length);
}
function currentTracePinyinPart(){
  const word = currentTraceWord();
  const parts = tracePinyinParts(word);
  return parts[tCharPos] || `Zeichen ${tCharPos + 1}`;
}
function renderTraceWordGuide(){
  const guide = $("traceWordGuide");
  const word = currentTraceWord();
  if(!guide || !word){ return; }
  const parts = tracePinyinParts(word);
  guide.innerHTML = "";
  word.chars.forEach((_, i) => {
    const chip = document.createElement("span");
    chip.className = "traceSyllable" + (i < tCharPos ? " done" : "") + (i === tCharPos ? " active" : "");
    chip.innerHTML = `${parts[i] || "–"}<small>${i + 1}/${word.chars.length}</small>`;
    guide.appendChild(chip);
  });
}
function activeTraceConfig(){ return TRACE_LEVELS[traceLevel] || TRACE_LEVELS.beginner; }
function setTraceCounter(){
  $("traceCounter").textContent = traceWords.length ? `${tWordIndex + 1} / ${traceWords.length}` : "0 / 0";
}
function setTraceLevelButtons(){
  $("traceLevelBeginner").classList.toggle("active", traceLevel === "beginner");
  $("traceLevelGuided").classList.toggle("active", traceLevel === "guided");
  $("traceLevelPro").classList.toggle("active", traceLevel === "pro");
  $("traceHelpText").textContent = activeTraceConfig().help;
}
function updateTraceInfo(){
  const word = currentTraceWord();
  if(!word) return;
  renderTraceWordGuide();
  const part = currentTracePinyinPart();
  const charText = word.chars.length > 1 ? `Zeichen ${tCharPos + 1}/${word.chars.length}: ${part}` : part;
  $("tracePinyin").textContent = `${activeTraceConfig().label} · ${charText}`;
  $("traceDe").textContent = word.de || "";
  setTraceCounter();
  setTraceLevelButtons();
}
function updateTraceNav(){
  $("tracePrev").disabled = (tWordIndex === 0);
  $("traceNext").disabled = (tWordIndex >= traceWords.length - 1);
}
function loadTraceWord(){
  const word = currentTraceWord();
  if(!word) return;
  tCharPos = 0;
  proFallback = false;
  loadTraceChar();
  updateTraceNav();
}
function traceVisualConfig(){
  const cfg = activeTraceConfig();
  const useFallback = traceLevel === "pro" && proFallback;
  const showGuide = (traceLevel === "guided") || useFallback;
  if(traceLevel === "beginner"){
    return {
      showOutline: cfg.showOutline,
      showCharacter: false,
      hintAfter: cfg.hintAfter,
      leniency: cfg.leniency,
      strokeColor: accentHex
    };
  }
  return {
    showOutline: showGuide ? true : cfg.showOutline,
    showCharacter: showGuide ? true : cfg.showCharacter,
    hintAfter: showGuide ? 1 : cfg.hintAfter,
    leniency: showGuide ? Math.max(cfg.leniency, 1.15) : cfg.leniency,
    strokeColor: showGuide ? "#111111" : accentHex
  };
}
function currentStrokeCount(){
  try{
    return tWriter?._character?.strokes?.length || tWriter?._character?.strokes?.length || null;
  }catch(e){ return null; }
}
function strokeNumberFromData(data){
  if(data && Number.isInteger(data.strokeNum)) return data.strokeNum;
  if(data && Number.isInteger(data.strokeIndex)) return data.strokeIndex;
  return null;
}
function clearBeginnerHint(){
  const layer = document.getElementById("traceHintLayer");
  if(layer) layer.innerHTML = "";
}
function animateOneStroke(strokeIndex, done){
  const hintLayer = document.getElementById("traceHintLayer");
  const zeichen = currentTraceChar();
  if(!hintLayer || !zeichen || typeof HanziWriter === "undefined"){
    if(done) done();
    return;
  }
  const token = traceQuizToken;
  clearBeginnerHint();
  setTraceStatus(`Schau dir Strich ${strokeIndex + 1} an …`, null);

  let hintWriter = null;
  try{
    hintWriter = HanziWriter.create("traceHintLayer", zeichen, {
      width: 280,
      height: 280,
      padding: 14,
      showOutline: false,
      showCharacter: false,
      strokeColor: "#111111",
      radicalColor: "#c0392b",
      drawingColor: "#111111",
      drawingWidth: 26
    });
  }catch(e){
    if(done) done();
    return;
  }

  const finish = () => {
    if(token !== traceQuizToken) return;
    setTraceStatus(`Zeichne Strich ${strokeIndex + 1} nach …`, null);
    setTimeout(() => {
      if(token === traceQuizToken) clearBeginnerHint();
      if(done) done();
    }, 120);
  };

  let returned = null;
  try{ returned = hintWriter.animateStroke(strokeIndex); }catch(e){ returned = null; }
  if(returned && typeof returned.then === "function") returned.then(finish).catch(finish);
  else setTimeout(finish, 750);
}
function loadTraceChar(){
  const zeichen = currentTraceChar();
  if(!zeichen) return;
  traceQuizToken++;
  updateTraceInfo();
  currentMistakes = 0;
  const target = $("traceTarget");
  target.innerHTML = "";
  const visual = traceVisualConfig();
  const partLabel = currentTracePinyinPart();
  const repeatText = traceRepeat ? "Noch einmal: " : "";
  traceRepeat = false;
  setTraceStatus(traceLevel === "pro" && !proFallback ? `${repeatText}Schreib ${partLabel} ohne Vorlage …` : `${repeatText}Schreib ${partLabel} …`, null);

  const writerTargetId = traceLevel === "beginner" ? "traceQuizLayer" : "traceTarget";
  if(traceLevel === "beginner"){
    const quizLayer = document.createElement("div");
    quizLayer.id = "traceQuizLayer";
    quizLayer.className = "traceLayer";
    const hintLayer = document.createElement("div");
    hintLayer.id = "traceHintLayer";
    hintLayer.className = "traceLayer";
    target.appendChild(quizLayer);
    target.appendChild(hintLayer);
  }

  tWriter = HanziWriter.create(writerTargetId, zeichen, {
    width: 280,
    height: 280,
    padding: 14,
    showOutline: visual.showOutline,
    showCharacter: visual.showCharacter,
    strokeColor: visual.strokeColor,
    radicalColor: "#c0392b",
    drawingColor: "#111111",
    drawingWidth: 26,
    leniency: visual.leniency,
    showHintAfterMisses: visual.hintAfter
  });

  const cfg = activeTraceConfig();
  if(traceLevel === "beginner"){
    setTimeout(startBeginnerStrokeQuiz, 80);
  }else if(cfg.autoAnimate && !proFallback){
    runTraceAnimationThenQuiz("Schau dir zuerst die Strichfolge an …");
  }else{
    setTimeout(startTraceQuiz, 80);
  }
}
function startBeginnerStrokeQuiz(){
  if(!tWriter) return;
  const token = ++traceQuizToken;
  beginnerCompletedStrokes = 0;
  currentMistakes = 0;
  if(tWriter.hideCharacter) tWriter.hideCharacter();
  const beginQuiz = () => {
    if(token !== traceQuizToken || !tWriter) return;
    let strokeMisses = 0;
    tWriter.quiz({
      onMistake(){
        if(token !== traceQuizToken) return;
        currentMistakes++;
        strokeMisses++;
        if(strokeMisses % 2 === 0){
          setTraceStatus("Schau her, so geht dieser Strich:", "bad");
          animateOneStroke(beginnerCompletedStrokes);
        }else{
          setTraceStatus("Nicht ganz – probiere diesen Strich noch einmal.", "bad");
        }
      },
      onCorrectStroke(data){
        if(token !== traceQuizToken) return;
        strokeMisses = 0;
        const doneStroke = strokeNumberFromData(data);
        if(doneStroke !== null) beginnerCompletedStrokes = Math.max(beginnerCompletedStrokes, doneStroke + 1);
        else beginnerCompletedStrokes++;
        const total = currentStrokeCount();
        if(total && beginnerCompletedStrokes < total){
          const nextStroke = beginnerCompletedStrokes;
          setTimeout(() => {
            if(token === traceQuizToken) animateOneStroke(nextStroke);
          }, 180);
        }else{
          setTraceStatus("…", null);
        }
      },
      onComplete(data){
        if(token !== traceQuizToken) return;
        if(data.totalMistakes > 0){
          traceRepeat = true;
          setTraceStatus("Dasselbe Zeichen kommt direkt noch einmal.", "bad");
          setTimeout(() => loadTraceChar(), 750);
          return;
        }
        proFallback = false;
        if(tCharPos < currentTraceWord().chars.length - 1){
          tCharPos++;
          setTimeout(() => loadTraceChar(), 300);
        }else{
          finishTraceWord();
        }
      }
    });
  };
  animateOneStroke(0, beginQuiz);
}
function startTraceQuiz(){
  if(!tWriter) return;
  const token = ++traceQuizToken;
  tWriter.hideCharacter();
  const visual = traceVisualConfig();
  if(visual.showCharacter) tWriter.showCharacter();
  setTraceStatus(traceLevel === "pro" && !proFallback ? `Schreib ${currentTracePinyinPart()} ohne Vorlage …` : `Schreib ${currentTracePinyinPart()} …`, null);
  tWriter.quiz({
    onMistake(){
      if(token !== traceQuizToken) return;
      currentMistakes++;
      if(traceLevel === "pro" && !proFallback && currentMistakes >= 3){
        proFallback = true;
        setTraceStatus("Nach drei Fehlern kommt das Zeichen mit Vorlage.", "bad");
        if(tWriter && typeof tWriter.cancelQuiz === "function") tWriter.cancelQuiz();
        setTimeout(() => { if(token === traceQuizToken) loadTraceChar(); }, 650);
        return;
      }
      setTraceStatus(traceLevel === "pro" && !proFallback ? "Nicht ganz – versuch es noch einmal." : "Nicht ganz – weiter üben.", "bad");
    },
    onCorrectStroke(){ if(token === traceQuizToken) setTraceStatus("…", null); },
    onComplete(data){
      if(token !== traceQuizToken) return;
      if(data.totalMistakes > 0){
        traceRepeat = true;
        setTraceStatus("Dasselbe Zeichen kommt direkt noch einmal.", "bad");
        setTimeout(() => loadTraceChar(), 750);
        return;
      }
      if(traceLevel === "pro" && proFallback){
        proFallback = false;
        traceRepeat = true;
        setTraceStatus("Gut mit Hilfe. Jetzt noch einmal ohne Vorlage.", "ok");
        setTimeout(() => loadTraceChar(), 850);
        return;
      }
      proFallback = false;
      if(tCharPos < currentTraceWord().chars.length - 1){
        tCharPos++;
        setTimeout(() => loadTraceChar(), 300);
      }else{
        finishTraceWord();
      }
    }
  });
}
function finishTraceWord(){
  if(autoNext){
    setTraceStatus("Wort geschafft.", "ok");
    setTimeout(moveToNextTraceWord, 700);
  }else{
    setTraceStatus("Wort geschafft. Drücke › für das nächste Wort.", "ok");
  }
}
function moveToNextTraceWord(){
  if(tWordIndex < traceWords.length - 1){
    tWordIndex++;
    loadTraceWord();
  }else{
    setTraceStatus("Alle Wörter geschafft!", "ok");
  }
}
function runTraceAnimationThenQuiz(message){
  if(!tWriter) return;
  const token = ++traceQuizToken;
  setTraceStatus(message || "Einmal ansehen …", null);
  if(tWriter && typeof tWriter.cancelQuiz === "function") tWriter.cancelQuiz();
  tWriter.showCharacter();
  let returned = null;
  try{
    returned = tWriter.animateCharacter({
      onComplete(){
        if(token === traceQuizToken) setTimeout(startTraceQuiz, 250);
      }
    });
  }catch(e){
    returned = tWriter.animateCharacter();
  }
  if(returned && typeof returned.then === "function"){
    returned.then(() => {
      if(token === traceQuizToken) setTimeout(startTraceQuiz, 250);
    });
  }else{
    setTimeout(() => { if(token === traceQuizToken) startTraceQuiz(); }, 1800);
  }
}
function showTraceThenPractice(){
  if(!tWriter) return;
  if(traceLevel === "beginner"){
    setTraceStatus("Wir starten dieses Zeichen noch einmal Strich für Strich.", null);
    setTimeout(loadTraceChar, 250);
    return;
  }
  runTraceAnimationThenQuiz("Einmal ansehen …");
}
function ensureTraceInit(){
  if(traceInited) return;
  traceInited = true;
  if(traceWords.length === 0){
    $("traceWrap").style.display = "none";
    $("traceEmpty").style.display = "block";
    return;
  }
  $("traceAuto").checked = autoNext;
  const autoLabel = document.querySelector('label[for="traceAuto"]');
  if(autoLabel) autoLabel.textContent = "Nach jedem Wort automatisch weiter";
  setTraceLevelButtons();
  loadTraceWord();
}

$("traceLevelBeginner").addEventListener("click", () => setTraceLevel("beginner"));
$("traceLevelGuided").addEventListener("click", () => setTraceLevel("guided"));
$("traceLevelPro").addEventListener("click", () => setTraceLevel("pro"));
function setTraceLevel(level){
  if(!TRACE_LEVELS[level] || traceLevel === level) return;
  traceLevel = level;
  localStorage.setItem(`cf_trace_level_${topic.id}`, traceLevel);
  proFallback = false;
  setTraceLevelButtons();
  if(traceInited) loadTraceChar();
}
$("traceShow").addEventListener("click", showTraceThenPractice);
$("traceStart").addEventListener("click", () => {
  proFallback = false;
  loadTraceChar();
});
$("traceNext").addEventListener("click", () => {
  if(tWordIndex < traceWords.length - 1){
    tWordIndex++;
    loadTraceWord();
    updateTraceNav();
  }
});
$("tracePrev").addEventListener("click", () => {
  if(tWordIndex > 0){
    tWordIndex--;
    loadTraceWord();
    updateTraceNav();
  }
});
$("traceAuto").addEventListener("change", e => {
  autoNext = e.target.checked;
  localStorage.setItem(`cf_trace_auto_${topic.id}`, autoNext ? "1" : "0");
});

// Nachzeichnen ist jetzt der erste Reiter.
ensureTraceInit();
</script>
