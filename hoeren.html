<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hören · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <main class="app listenApp" id="listenApp">
    <div class="topbar topbarSticky"><a class="back" id="back">← Zurück</a><h1 id="title" class="pageTitleResponsive topbarPageTitle">Hören</h1></div>
    <p class="subtitle" id="pageSubtitle"></p>

    <section class="card listenCard">
      <div class="toolbar listenToolbar">
        <label class="tempoLabel">
          Sprechtempo:
          <input type="range" id="tempo" min="0.4" max="1.0" step="0.1" value="1.0">
          <strong id="tempoValue">1.0</strong>
        </label>
        <div class="toggleRow" id="metaToggles">
          <button id="togglePinyin" class="toggleBtn" type="button" aria-pressed="false">Pinyin ein</button>
          <button id="toggleDeutsch" class="toggleBtn" type="button" aria-pressed="false">Deutsch ein</button>
        </div>
      </div>

      <div id="panelVocab"><div id="vocabGrid" class="vocabList"></div></div>
      <div id="panelSentences"><div id="dialog" class="dialog"></div></div>
      <div id="panelStory" class="storyListenPanel">
        <div class="storyListenIcon" aria-hidden="true">▶</div>
        <h2>Ganze Geschichte</h2>
        <p>Erzähltext und Dialoge werden in der richtigen Reihenfolge vollständig abgespielt.</p>
        <div class="storyListenActions">
          <button id="playStoryBtn" class="primaryAction" type="button">Geschichte abspielen</button>
          <button id="stopStoryBtn" type="button" style="display:none;">Stopp</button>
        </div>
        <div class="storyListenStatus" id="storyStatus">Bereit</div>
        <div class="progressBar" aria-label="Abspielfortschritt"><div class="progressFill storyProgressFill" id="storyProgress"></div></div>
      </div>
    </section>
  </main>

<script src="topics.js"></script>
<script src="geschichte-data.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="common.js"></script>
<script>
const topic = getTopic();
const params = new URLSearchParams(location.search);
const mode = ["vocab","sentences","story"].includes(params.get("mode")) ? params.get("mode") : "vocab";
applyTheme(topic, "Chinesisch festigen");
document.getElementById("back").href = `kapitel.html?id=${topic.id}`;

const modeText = {
  vocab: ["Vokabeln hören", "Tippe jedes Wort an, höre genau zu und sprich es direkt nach."],
  sentences: ["Sätze hören", "Höre jeden Dialogsatz einzeln und sprich ihn direkt nach."],
  story: ["Geschichte hören", "Höre die vollständige Geschichte mit Erzähltext und Dialogen am Stück."]
};
document.getElementById("title").textContent = `${Number(topic.id)}. ${topic.title}`;
document.getElementById("pageSubtitle").textContent = `${modeText[mode][0]} · ${modeText[mode][1]}`;
document.getElementById("panelVocab").hidden = mode !== "vocab";
document.getElementById("panelSentences").hidden = mode !== "sentences";
document.getElementById("panelStory").hidden = mode !== "story";
document.getElementById("metaToggles").hidden = mode === "story";

const listenApp = document.getElementById("listenApp");
function toggleMeta(kind){
  const cls = kind === "pinyin" ? "show-pinyin" : "show-deutsch";
  listenApp.classList.toggle(cls);
  const on = listenApp.classList.contains(cls);
  const btn = document.getElementById(kind === "pinyin" ? "togglePinyin" : "toggleDeutsch");
  btn.classList.toggle("active", on);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.textContent = kind === "pinyin" ? (on ? "Pinyin aus" : "Pinyin ein") : (on ? "Deutsch aus" : "Deutsch ein");
}
document.getElementById("togglePinyin").onclick = () => toggleMeta("pinyin");
document.getElementById("toggleDeutsch").onclick = () => toggleMeta("deutsch");

const tempoEl = document.getElementById("tempo");
const tempoValue = document.getElementById("tempoValue");
tempoEl.addEventListener("input", () => tempoValue.textContent = tempoEl.value);

let playToken = 0;
function stopAudio(){
  playToken++;
  if(typeof _cfStopAll === "function") _cfStopAll();
  else if("speechSynthesis" in window) speechSynthesis.cancel();
}
function speak(text, speaker){
  if(!text) return;
  playToken++;
  cfSpeakZh(text, { rate: parseFloat(tempoEl.value), queue: false, speaker });
}
function speakAndWait(text, token, speaker){
  return new Promise(resolve => {
    if(token !== playToken || !text) return resolve();
    cfSpeakZh(text, { rate: parseFloat(tempoEl.value), queue: true, onend: resolve, speaker });
  });
}

function hexToRgb(hex){
  const h = hex.replace("#","");
  return {r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)};
}
function rgbToHex(r,g,b){ return "#" + [r,g,b].map(x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join(""); }
function mixWithWhite(hex, amount){ const c=hexToRgb(hex); return rgbToHex(c.r+(255-c.r)*amount,c.g+(255-c.g)*amount,c.b+(255-c.b)*amount); }
function luminance(hex){
  const c=hexToRgb(hex); const a=[c.r,c.g,c.b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*a[0]+.7152*a[1]+.0722*a[2];
}
function readableText(bg){ return luminance(bg)>.58 ? "#0B1B2E" : "#FFFFFF"; }
function isSuRan(name){ return /su\s*ran|sū\s*rán|苏然|蘇然/i.test(name || ""); }
function bubbleColor(speaker){ return isSuRan(speaker) ? mixWithWhite(topic.accent,.42) : "#FFFFFF"; }
function bubbleSide(speaker){ return isSuRan(speaker) ? "left" : "right"; }

const heardKey = `cf_hoeren_heard_${topic.id}`;
let heard = {w:{},s:{}};
try{
  const st=JSON.parse(localStorage.getItem(heardKey)||"{}");
  if(st&&typeof st==="object"){heard.w=st.w||{};heard.s=st.s||{};}
}catch(e){}
const storyDoneKey = `cf_hoeren_story_complete_v3_${topic.id}`;
let storyComplete = localStorage.getItem(storyDoneKey) === "1" || (cfGetScore("hoeren_geschichte", topic.id) || 0) >= 100;

const vocabItems = [...(topic.vocab || []), ...(topic.understandingVocab || [])].filter(v => v && v.zh);
function splitChineseSentences(text){
  return String(text || "").match(/[^。！？!?]+[。！？!?]+|[^。！？!?]+$/g)?.map(x => x.trim()).filter(Boolean) || [];
}
function splitPinyinSentences(text){
  return String(text || "").match(/.*?(?:[.!?]+(?=\s|$)|$)/g)?.map(x => x.trim()).filter(Boolean) || [];
}
const sentenceData = (topic.storyDialog || []).filter(x => x && x.zh).flatMap(line => {
  const zhParts = splitChineseSentences(line.zh);
  const pyParts = splitPinyinSentences(line.pinyin || "");
  return zhParts.map((zh, index) => ({
    ...line,
    zh,
    pinyin: pyParts.length === zhParts.length ? pyParts[index] : (line.pinyin || ""),
    de: line.de || ""
  }));
});
const fullChapter = (window.CF_STORY && Array.isArray(CF_STORY.chapters))
  ? CF_STORY.chapters.find(ch => String(ch.id).padStart(2,"0") === String(topic.id).padStart(2,"0"))
  : null;
const fullStoryUnits = fullChapter && Array.isArray(fullChapter.units) && fullChapter.units.length
  ? fullChapter.units.filter(x => x && x.zh)
  : sentenceData;

function recomputeScores(){
  const vocabZh = [...new Set(vocabItems.map(v=>v.zh))];
  const sentenceZh = [...new Set(sentenceData.map(v=>v.zh))];
  const heardW = vocabZh.filter(z=>heard.w[z]).length;
  const heardS = sentenceZh.filter(z=>heard.s[z]).length;
  const pv = vocabZh.length ? Math.round(heardW/vocabZh.length*100) : 0;
  const ps = sentenceZh.length ? Math.round(heardS/sentenceZh.length*100) : 0;
  cfSetScore("hoeren_vocab",pv,topic.id);
  cfSetScore("hoeren_saetze",ps,topic.id);
  cfSetScore("hoeren_geschichte",storyComplete ? 100 : 0,topic.id);
  if(vocabZh.length && heardW>=vocabZh.length) cfMarkDone("hoeren_vocab",topic.id);
  if(sentenceZh.length && heardS>=sentenceZh.length) cfMarkDone("hoeren_saetze",topic.id);
  if(storyComplete) cfMarkDone("hoeren_geschichte",topic.id);
}
function markHeard(kind,keyText){
  if(!keyText) return;
  const bucket=kind==="s"?heard.s:heard.w;
  if(!bucket[keyText]){
    bucket[keyText]=1;
    try{localStorage.setItem(heardKey,JSON.stringify(heard));}catch(e){}
    recomputeScores();
  }
}

const vocabGrid=document.getElementById("vocabGrid");
function renderVocabSection(title,items){
  if(!items||!items.length)return;
  const section=document.createElement("section");section.className="vocabSection";
  const h=document.createElement("h2");h.className="sectionTitle";h.textContent=title;
  const grid=document.createElement("div");grid.className="vocabGrid";
  items.forEach(v=>{
    const card=document.createElement("button");card.className="vocabCard";card.type="button";
    card.innerHTML=`<div class="zh">${escapeHtml(v.zh)}</div><div class="pinyin">${escapeHtml(v.pinyin||"")}</div><div class="de">${escapeHtml(v.de||"")}</div>`;
    card.addEventListener("click",()=>{speak(v.zh);markHeard("w",v.zh);});
    grid.appendChild(card);
  });
  section.append(h,grid);vocabGrid.appendChild(section);
}
if(mode === "vocab"){
  if(!vocabItems.length) vocabGrid.innerHTML='<div class="empty">Für dieses Kapitel sind noch keine Vokabeln eingetragen.</div>';
  else{
    renderVocabSection("Aktive Vokabeln",topic.vocab||[]);
    renderVocabSection("Zum Verstehen",topic.understandingVocab||[]);
  }
}

const dialogEl=document.getElementById("dialog");
if(mode === "sentences"){
  if(!sentenceData.length) dialogEl.innerHTML='<div class="empty">Für dieses Kapitel sind noch keine Dialogsätze eingetragen.</div>';
  else sentenceData.forEach(line=>{
    const color=bubbleColor(line.speaker);
    const row=document.createElement("div");row.className=`bubbleRow ${bubbleSide(line.speaker)}`;
    row.innerHTML=`<button type="button" class="speechBubble" style="background:${color};color:${readableText(color)}"><span class="speaker">${escapeHtml(line.speaker||"")}</span><span class="speechText">${escapeHtml(line.zh||"")}</span>${line.pinyin?`<span class="speechPinyin">${escapeHtml(line.pinyin)}</span>`:""}${line.de?`<span class="speechDe">${escapeHtml(line.de)}</span>`:""}</button>`;
    row.querySelector(".speechBubble").addEventListener("click",()=>{speak(line.zh,line.speaker);markHeard("s",line.zh);});
    dialogEl.appendChild(row);
  });
}

const playStoryBtn=document.getElementById("playStoryBtn");
const stopStoryBtn=document.getElementById("stopStoryBtn");
const storyStatus=document.getElementById("storyStatus");
const storyProgress=document.getElementById("storyProgress");
function setStoryProgress(done,total){
  const p=total ? Math.round(done/total*100) : 0;
  storyProgress.style.width=`${p}%`;
  storyStatus.textContent = done >= total && total ? "Geschichte vollständig angehört" : (done ? `${done} von ${total} Abschnitten` : "Bereit");
}
setStoryProgress(storyComplete ? fullStoryUnits.length : 0,fullStoryUnits.length);
async function playStory(){
  if(!fullStoryUnits.length){storyStatus.textContent="Für dieses Kapitel ist noch keine Geschichte eingetragen.";return;}
  stopAudio();
  const token=playToken;
  playStoryBtn.disabled=true;
  stopStoryBtn.style.display="";
  setStoryProgress(0,fullStoryUnits.length);
  for(let i=0;i<fullStoryUnits.length;i++){
    if(token!==playToken) break;
    const unit=fullStoryUnits[i];
    await speakAndWait(unit.zh,token,unit.speaker||"");
    if(token!==playToken) break;
    setStoryProgress(i+1,fullStoryUnits.length);
  }
  const finished=token===playToken;
  playStoryBtn.disabled=false;
  stopStoryBtn.style.display="none";
  if(finished){
    storyComplete=true;
    localStorage.setItem(storyDoneKey,"1");
    recomputeScores();
    setStoryProgress(fullStoryUnits.length,fullStoryUnits.length);
  }else{
    storyStatus.textContent="Wiedergabe beendet";
  }
}
playStoryBtn.onclick=playStory;
stopStoryBtn.onclick=()=>{stopAudio();playStoryBtn.disabled=false;stopStoryBtn.style.display="none";storyStatus.textContent="Wiedergabe beendet";};
window.addEventListener("beforeunload",stopAudio);
recomputeScores();
</script>
</body>
</html>
