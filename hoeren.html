<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hören · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chinesisch" />

</head>
<body>
  <main class="app listenApp" id="listenApp">
    <div class="topbar">
      <a class="back" id="back">← Kapitel</a>
    </div>
    <h1 id="title">Hören</h1>

    <section class="card">
      <div class="toolbar">
        <label class="tempoLabel">
          Sprechtempo:
          <input type="range" id="tempo" min="0.4" max="1.0" step="0.1" value="1.0">
          <strong id="tempoValue">1.0</strong>
        </label>
        <button id="togglePinyin" class="toggleBtn" type="button" aria-pressed="false">Pinyin anzeigen</button>
        <button id="toggleDeutsch" class="toggleBtn" type="button" aria-pressed="false">Deutsch anzeigen</button>
        <button id="stopBtn" type="button">Stopp</button>
        <button id="playAllBtn" type="button">Geschichte abspielen</button>
      </div>

      <div class="tabbar">
        <button class="tab active" data-tab="vocab">Vokabeln</button>
        <button class="tab" data-tab="dialog">Geschichte</button>
      </div>

      <div class="panel active" id="panel-vocab">
        <div id="vocabGrid" class="vocabList"></div>
      </div>

      <div class="panel" id="panel-dialog">
        <div id="dialog" class="dialog"></div>
      </div>
    </section>
  </main>

<script src="topics.js"></script>
<script src="common.js"></script>
<script>
const topic = getTopic();
document.documentElement.classList.add("noScroll");
applyTheme(topic, "Chinesisch festigen");
document.getElementById("back").href = `kapitel.html?id=${topic.id}`;
document.getElementById("title").textContent = `${topic.id}. ${topic.title} · Hören`;

const listenApp = document.getElementById("listenApp");
function toggleMeta(kind){
  const cls = kind === "pinyin" ? "show-pinyin" : "show-deutsch";
  listenApp.classList.toggle(cls);
  const on = listenApp.classList.contains(cls);
  const btn = document.getElementById(kind === "pinyin" ? "togglePinyin" : "toggleDeutsch");
  btn.classList.toggle("active", on);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.textContent = kind === "pinyin" ? (on ? "Pinyin ausblenden" : "Pinyin anzeigen") : (on ? "Deutsch ausblenden" : "Deutsch anzeigen");
}
document.getElementById("togglePinyin").onclick = () => toggleMeta("pinyin");
document.getElementById("toggleDeutsch").onclick = () => toggleMeta("deutsch");

const tempoEl = document.getElementById("tempo");
const tempoValue = document.getElementById("tempoValue");
tempoEl.addEventListener("input", () => tempoValue.textContent = tempoEl.value);

let zhVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => (v.lang || "").toLowerCase().startsWith("zh-cn"))
         || voices.find(v => (v.lang || "").toLowerCase().startsWith("zh"))
         || null;
}
pickVoice();
speechSynthesis.onvoiceschanged = pickVoice;

let playToken = 0;
function stopAudio(){
  playToken++;
  speechSynthesis.cancel();
}
function speak(text, reset=true){
  if(!text) return;
  if(reset) stopAudio();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = parseFloat(tempoEl.value);
  if(zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}
function speakAndWait(text, token){
  return new Promise(resolve => {
    if(token !== playToken || !text) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = parseFloat(tempoEl.value);
    if(zhVoice) u.voice = zhVoice;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}
document.getElementById("stopBtn").onclick = stopAudio;

const tabs = [...document.querySelectorAll(".tab")];
function updateStoryButtons(activeTab){
  const show = activeTab === "dialog";
  document.getElementById("stopBtn").style.display = show ? "" : "none";
  document.getElementById("playAllBtn").style.display = show ? "" : "none";
}
tabs.forEach(tab => tab.addEventListener("click", () => {
  tabs.forEach(t => t.classList.toggle("active", t === tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`panel-${tab.dataset.tab}`).classList.add("active");
  updateStoryButtons(tab.dataset.tab);
}));
updateStoryButtons("vocab");

function hexToRgb(hex){
  const h = hex.replace("#","");
  return {r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)};
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2,"0")).join("");
}
function mixWithWhite(hex, amount){
  const c = hexToRgb(hex);
  return rgbToHex(c.r + (255-c.r)*amount, c.g + (255-c.g)*amount, c.b + (255-c.b)*amount);
}
function luminance(hex){
  const c = hexToRgb(hex);
  const a = [c.r,c.g,c.b].map(v => {v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4);});
  return .2126*a[0] + .7152*a[1] + .0722*a[2];
}
function readableText(bg){ return luminance(bg) > .58 ? "#0B1B2E" : "#FFFFFF"; }
function isLinYue(name){ return /lin\s*yue|lín\s*yuè|林月|林悦|林越/i.test(name || ""); }
function isSuRan(name){ return /su\s*ran|sū\s*rán|苏然|蘇然/i.test(name || ""); }
function bubbleColor(speaker){
  if(isLinYue(speaker)) return "#FFFFFF";
  if(isSuRan(speaker)) return mixWithWhite(topic.accent, .42);
  return mixWithWhite(topic.accent, .68);
}
function bubbleSide(speaker){ return isLinYue(speaker) ? "right" : "left"; }

const vocabGrid = document.getElementById("vocabGrid");
function renderVocabSection(title, items){
  if(!items || items.length === 0) return;
  const section = document.createElement("section");
  section.className = "vocabSection";
  const h = document.createElement("h2");
  h.className = "sectionTitle";
  h.textContent = title;
  const grid = document.createElement("div");
  grid.className = "vocabGrid";
  items.forEach(v => {
    const card = document.createElement("button");
    card.className = "vocabCard";
    card.type = "button";
    card.innerHTML = `
      <div class="zh">${escapeHtml(v.zh)}</div>
      <div class="pinyin">${escapeHtml(v.pinyin || "")}</div>
      <div class="de">${escapeHtml(v.de || "")}</div>
    `;
    card.addEventListener("click", () => speak(v.zh));
    grid.appendChild(card);
  });
  section.appendChild(h);
  section.appendChild(grid);
  vocabGrid.appendChild(section);
}
if((!topic.vocab || topic.vocab.length === 0) && (!topic.understandingVocab || topic.understandingVocab.length === 0)){
  vocabGrid.innerHTML = `<div class="empty">Für dieses Kapitel sind noch keine Vokabeln eingetragen.</div>`;
}else{
  renderVocabSection("Aktive Vokabeln", topic.vocab || []);
  renderVocabSection("Zum Verstehen", topic.understandingVocab || []);
}

const dialogEl = document.getElementById("dialog");
const dialogData = topic.storyDialog || [];
if(dialogData.length === 0){
  dialogEl.innerHTML = `<div class="empty">Für dieses Kapitel ist noch keine Geschichte eingetragen.</div>`;
}else{
  dialogData.forEach(line => {
    const color = bubbleColor(line.speaker);
    const row = document.createElement("div");
    row.className = `bubbleRow ${bubbleSide(line.speaker)}`;
    row.innerHTML = `
      <div class="speechBubble" style="background:${color};color:${readableText(color)}">
        <div class="speaker">${escapeHtml(line.speaker || "")}</div>
        <div class="speechText">${escapeHtml(line.zh || "")}</div>
        ${line.pinyin ? `<div class="speechPinyin">${escapeHtml(line.pinyin)}</div>` : ""}
        ${line.de ? `<div class="speechDe">${escapeHtml(line.de)}</div>` : ""}
      </div>
    `;
    row.querySelector(".speechBubble").addEventListener("click", () => speak(line.zh));
    dialogEl.appendChild(row);
  });
}

async function playAll(){
  document.querySelector('[data-tab="dialog"]').click();
  stopAudio();
  const token = playToken;
  for(const line of dialogData){
    if(token !== playToken) return;
    await speakAndWait(line.zh, token);
  }
}
document.getElementById("playAllBtn").onclick = playAll;
</script>
</body>
</html>
