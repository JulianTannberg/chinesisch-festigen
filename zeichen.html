<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zeichen nachzeichnen · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chinesisch" />

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>

  <style>
    .zeichenCard{
      padding:16px;
    }

    .zeichenInputRow{
      position:relative;
      z-index:5;
      display:flex;
      gap:8px;
      margin:14px 0 8px;
    }

    #charInput{
      flex:1;
      min-width:0;
      font-size:22px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background:var(--card-strong);
      color:inherit;
      pointer-events:auto;
      touch-action:manipulation;
    }

    #goBtn{
      flex:0 0 auto;
      font-size:18px;
      padding:12px 18px;
      border-radius:12px;
      border:none;
      background:var(--card-strong);
      outline:2px solid rgba(255,255,255,.26);
      color:inherit;
    }

    .zeichenStage{
      margin-top:18px;
    }

    .zeichenCounter{
      margin:6px 0;
      text-align:center;
      opacity:.85;
    }

    /* Entspricht dem Schreibtraining „Anfänger“ */
    #target{
      width:280px;
      height:280px;
      max-width:100%;
      margin:8px auto;
      position:relative;
      overflow:hidden;
      border-radius:18px;
      background:#fff;
      box-shadow:0 10px 30px var(--shadow);
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      background-image:
        linear-gradient(to right,
          transparent calc(50% - .75px),
          rgba(0,0,0,.13) calc(50% - .75px),
          rgba(0,0,0,.13) calc(50% + .75px),
          transparent calc(50% + .75px)),
        linear-gradient(to bottom,
          transparent calc(50% - .75px),
          rgba(0,0,0,.13) calc(50% - .75px),
          rgba(0,0,0,.13) calc(50% + .75px),
          transparent calc(50% + .75px));
      background-size:100% 100%;
      background-repeat:no-repeat;
      background-position:center;
    }

    #target .traceLayer{
      position:absolute;
      inset:0;
      width:280px;
      height:280px;
    }

    #zQuizLayer{
      z-index:1;
    }

    /* Wichtig: Diese Ebene darf Finger/Stift nicht blockieren. */
    #zHintLayer{
      z-index:2;
      pointer-events:none;
    }

    #feedback{
      min-height:1.5em;
      margin-top:10px;
      text-align:center;
      font-weight:800;
    }

    #feedback.ok{ color:#86efac; }
    #feedback.bad{ color:#fecaca; }

    .zeichenButtons{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    @media(max-width:430px){
      .zeichenInputRow{
        display:grid;
        grid-template-columns:minmax(0,1fr) auto;
      }
      #goBtn{
        padding-inline:15px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="index.html">← Kapitelübersicht</a>
    </div>

    <h1>Zeichen nachzeichnen</h1>
    <p class="subtitle">
      Gib ein chinesisches Zeichen oder ein ganzes Wort ein. Wie beim Schreibtraining „Anfänger“ siehst du die Vorlage und jeden Strich einzeln.
    </p>

    <section class="card zeichenCard">
      <div class="zeichenInputRow">
        <input
          id="charInput"
          lang="zh"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="z. B. 好 oder 你好"
          aria-label="Chinesische Zeichen eingeben"
        />
        <button id="goBtn" type="button">Los</button>
      </div>

      <p id="hint" class="small">Mehrere Zeichen werden nacheinander geübt.</p>

      <div id="stage" class="zeichenStage" hidden>
        <p id="stageLine" class="zeichenCounter"></p>
        <div id="target" aria-label="Zeichenfläche zum Nachzeichnen"></div>

        <div class="zeichenButtons">
          <button id="restartBtn" type="button">Zeichen noch einmal</button>
          <button id="newBtn" type="button">Andere Zeichen eingeben</button>
        </div>

        <p id="feedback" aria-live="polite">&nbsp;</p>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    let chars = [];
    let idx = 0;
    let writer = null;
    let token = 0;

    function extractHanzi(value){
      return [...String(value || "")].filter(char => /[\u3400-\u9FFF]/.test(char));
    }

    function setStatus(text, kind = ""){
      const el = $("feedback");
      el.textContent = text || "\u00A0";
      el.className = kind;
    }

    function cancelWriter(){
      token++;
      if(writer && typeof writer.cancelQuiz === "function"){
        try{ writer.cancelQuiz(); }catch(error){}
      }
      writer = null;
    }

    function clearHint(){
      const layer = $("zHintLayer");
      if(layer) layer.innerHTML = "";
    }

    function start(){
      const enteredChars = extractHanzi($("charInput").value);

      if(enteredChars.length === 0){
        $("hint").textContent = "Bitte mindestens ein chinesisches Zeichen eingeben.";
        $("charInput").focus();
        return;
      }

      cancelWriter();
      chars = enteredChars;
      idx = 0;
      $("hint").textContent = `${chars.length} Zeichen ausgewählt.`;
      $("stage").hidden = false;
      render();
    }

    function render(){
      const char = chars[idx];
      if(!char) return;

      $("stageLine").textContent = `Zeichen ${idx + 1} von ${chars.length}: ${char}`;
      setStatus("");
      loadChar(char);
    }

    function animateHint(char, strokeIndex, done){
      const hintLayer = $("zHintLayer");
      if(!hintLayer || typeof HanziWriter === "undefined"){
        if(done) done();
        return;
      }

      const activeToken = token;
      clearHint();
      setStatus(`Schau dir Strich ${strokeIndex + 1} an …`);

      let hintWriter;
      try{
        hintWriter = HanziWriter.create("zHintLayer", char, {
          width:280,
          height:280,
          padding:14,
          showOutline:false,
          showCharacter:false,
          strokeColor:"#111111",
          radicalColor:"#c0392b",
          drawingColor:"#111111",
          drawingWidth:26
        });
      }catch(error){
        if(done) done();
        return;
      }

      const finish = () => {
        if(activeToken !== token) return;
        setStatus(`Zeichne Strich ${strokeIndex + 1} nach …`);
        window.setTimeout(() => {
          if(activeToken !== token) return;
          clearHint();
          if(done) done();
        }, 120);
      };

      try{
        const animation = hintWriter.animateStroke(strokeIndex);
        if(animation && typeof animation.then === "function"){
          animation.then(finish).catch(finish);
        }else{
          window.setTimeout(finish, 750);
        }
      }catch(error){
        window.setTimeout(finish, 100);
      }
    }

    function loadChar(char){
      cancelWriter();
      const activeToken = token;

      const target = $("target");
      target.innerHTML = "";

      const quizLayer = document.createElement("div");
      quizLayer.id = "zQuizLayer";
      quizLayer.className = "traceLayer";

      const hintLayer = document.createElement("div");
      hintLayer.id = "zHintLayer";
      hintLayer.className = "traceLayer";

      target.append(quizLayer, hintLayer);

      if(typeof HanziWriter === "undefined"){
        setStatus("Die Zeichenfunktion konnte nicht geladen werden. Bitte prüfe die Internetverbindung.", "bad");
        return;
      }

      try{
        writer = HanziWriter.create("zQuizLayer", char, {
          width:280,
          height:280,
          padding:14,
          showOutline:true,
          showCharacter:false,
          strokeColor:"#03172B",
          radicalColor:"#c0392b",
          drawingColor:"#111111",
          drawingWidth:26,
          leniency:1.25,
          showHintAfterMisses:9999
        });
      }catch(error){
        setStatus("Für dieses Zeichen konnten keine Strichdaten geladen werden.", "bad");
        return;
      }

      let completed = 0;
      let strokeMisses = 0;

      const beginQuiz = () => {
        if(activeToken !== token || !writer) return;

        setStatus("Zeichne den Strich nach …");
        writer.quiz({
          onMistake(){
            if(activeToken !== token) return;

            strokeMisses++;
            if(strokeMisses % 3 === 0){
              setStatus("Schau her, so geht dieser Strich:", "bad");
              animateHint(char, completed);
            }else{
              setStatus("Nicht ganz – probiere den Strich noch einmal.", "bad");
            }
          },

          onCorrectStroke(data){
            if(activeToken !== token) return;

            strokeMisses = 0;
            const nextStroke = data && Number.isInteger(data.strokeNum)
              ? data.strokeNum + 1
              : completed + 1;
            completed = Math.max(completed, nextStroke);

            const total = writer?._character?.strokes?.length || null;
            if(total && completed < total){
              window.setTimeout(() => {
                if(activeToken === token) animateHint(char, completed);
              }, 180);
            }else{
              setStatus("…");
            }
          },

          onComplete(){
            if(activeToken !== token) return;

            if(idx < chars.length - 1){
              setStatus("Geschafft! Das nächste Zeichen kommt …", "ok");
              window.setTimeout(() => {
                if(activeToken !== token) return;
                idx++;
                render();
              }, 700);
            }else{
              setStatus("Geschafft! Alle Zeichen sind fertig.", "ok");
            }
          }
        });
      };

      animateHint(char, 0, beginQuiz);
    }

    $("goBtn").addEventListener("click", start);

    $("charInput").addEventListener("keydown", event => {
      if(event.key === "Enter"){
        event.preventDefault();
        start();
      }
    });

    $("restartBtn").addEventListener("click", render);

    $("newBtn").addEventListener("click", () => {
      cancelWriter();
      $("stage").hidden = true;
      $("charInput").focus();
      $("charInput").select();
    });
  </script>
</body>
</html>
