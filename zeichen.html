<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zeichen nachzeichnen · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="index.html">← Kapitelübersicht</a>
    </div>
    <h1>Zeichen nachzeichnen</h1>

    <p style="opacity:.8;margin-top:-6px;">
      Zeichen eingeben und Schritt für Schritt mit der richtigen Strichreihenfolge üben.
    </p>

    <div style="display:flex;gap:8px;margin:14px 0;">
      <input id="charInput" type="text" inputmode="text" autocomplete="off"
        placeholder="z. B. 好"
        style="flex:1;font-size:22px;padding:12px 14px;border-radius:12px;
               border:1px solid var(--stroke);background:var(--card-strong);color:inherit;" />
      <button id="goBtn"
        style="font-size:18px;padding:12px 18px;border-radius:12px;border:none;
               background:var(--card-strong);outline:2px solid rgba(255,255,255,.26);color:inherit;">
        Los
      </button>
    </div>

    <p id="hint" style="opacity:.75;font-size:14px;">Mehrere Zeichen möglich – sie kommen nacheinander.</p>

    <div id="stage" style="display:none;">
      <p id="stageLine" style="margin:6px 0;opacity:.85;"></p>
      <div id="target"
        style="width:100%;max-width:300px;aspect-ratio:1;margin:8px auto;
               background:#ffffff;border-radius:16px;position:relative;"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;">
        <button id="restartBtn" style="padding:10px 16px;border-radius:12px;border:1px solid var(--stroke);background:transparent;color:inherit;">Nochmal</button>
      </div>
      <p id="feedback" style="text-align:center;margin-top:10px;min-height:1.4em;"></p>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let chars = [];
    let idx = 0;
    let writer = null;
    let token = 0;

    function extractHanzi(s){
      return [...s].filter(c => /[\u3400-\u9FFF]/.test(c));
    }

    function start(){
      chars = extractHanzi($("charInput").value);
      if(chars.length === 0){
        $("hint").textContent = "Bitte ein chinesisches Zeichen eingeben.";
        return;
      }
      idx = 0;
      $("stage").style.display = "block";
      render();
    }

    function render(){
      const ch = chars[idx];
      $("stageLine").textContent = `Zeichen ${idx+1} von ${chars.length}: ${ch}`;
      $("feedback").textContent = "";
      loadChar(ch);
    }

    function setStatus(t){ $("feedback").textContent = t; }
    function clearHint(){ const h = document.getElementById("zHintLayer"); if(h) h.innerHTML = ""; }

    // Einen einzelnen Strich auf der Hint-Ebene vorzeigen, dann Callback
    function animateHint(ch, strokeIndex, done){
      const hintLayer = document.getElementById("zHintLayer");
      if(!hintLayer || typeof HanziWriter === "undefined"){ if(done) done(); return; }
      const myToken = token;
      clearHint();
      setStatus(`Schau dir Strich ${strokeIndex + 1} an …`);
      let hintWriter = null;
      try{
        hintWriter = HanziWriter.create("zHintLayer", ch, {
          width: 280, height: 280, padding: 14,
          showOutline: false, showCharacter: false,
          strokeColor: "#111111", radicalColor: "#c0392b",
          drawingColor: "#111111", drawingWidth: 26
        });
      }catch(e){ if(done) done(); return; }
      const finish = () => {
        if(myToken !== token) return;
        setStatus(`Zeichne Strich ${strokeIndex + 1} nach …`);
        setTimeout(() => { if(myToken === token) clearHint(); if(done) done(); }, 120);
      };
      let returned = null;
      try{ returned = hintWriter.animateStroke(strokeIndex); }catch(e){ returned = null; }
      if(returned && typeof returned.then === "function") returned.then(finish).catch(finish);
      else setTimeout(finish, 750);
    }

    function loadChar(ch){
      token++;
      const myToken = token;

      const target = $("target");
      target.innerHTML = "";
      const quizLayer = document.createElement("div");
      quizLayer.id = "zQuizLayer";
      quizLayer.style.cssText = "position:absolute;inset:0;width:280px;height:280px;";
      const hintLayer = document.createElement("div");
      hintLayer.id = "zHintLayer";
      hintLayer.style.cssText = "position:absolute;inset:0;width:280px;height:280px;";
      target.appendChild(quizLayer);
      target.appendChild(hintLayer);

      try{
        writer = HanziWriter.create("zQuizLayer", ch, {
          width: 280, height: 280, padding: 14,
          showOutline: false,
          showCharacter: false,
          strokeColor: "#111111",
          radicalColor: "#c0392b",
          drawingColor: "#111111",
          drawingWidth: 26,
          leniency: 1.1,
          showHintAfterMisses: 9999
        });
      }catch(e){
        setStatus("Für dieses Zeichen gibt es keine Strichdaten.");
        return;
      }

      let completed = 0;
      let strokeMisses = 0;
      const beginQuiz = () => {
        if(myToken !== token || !writer) return;
        setStatus("Zeichne den Strich nach …");
        writer.quiz({
          onMistake(){
            if(myToken !== token) return;
            strokeMisses++;
            if(strokeMisses % 3 === 0){
              setStatus("Schau her, so geht dieser Strich:");
              animateHint(ch, completed);
            }else{
              setStatus("Nicht ganz – probiere den Strich noch einmal.");
            }
          },
          onCorrectStroke(data){
            if(myToken !== token) return;
            strokeMisses = 0;
            const n = (data && Number.isInteger(data.strokeNum)) ? data.strokeNum + 1 : completed + 1;
            completed = Math.max(completed, n);
            const total = writer?._character?.strokes?.length || null;
            if(total && completed < total){
              setTimeout(() => { if(myToken === token) animateHint(ch, completed); }, 180);
            }else{
              setStatus("…");
            }
          },
          onComplete(){
            if(myToken !== token) return;
            if(chars.length > 1 && idx < chars.length - 1){
              setStatus("Geschafft. Weiter …");
              setTimeout(() => { idx++; render(); }, 700);
            }else{
              setStatus("Geschafft.");
            }
          }
        });
      };

      animateHint(ch, 0, beginQuiz);
    }

    $("goBtn").addEventListener("click", start);
    $("charInput").addEventListener("keydown", e => { if(e.key === "Enter") start(); });
    $("restartBtn").addEventListener("click", render);
  </script>
</body>
</html>
