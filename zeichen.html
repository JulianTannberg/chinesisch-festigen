<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zeichen nachzeichnen · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="index.html">← Kapitelübersicht</a>
    </div>
    <h1>Zeichen nachzeichnen</h1>

    <p style="opacity:.8;margin-top:-6px;">
      Zeichen eingeben und Schritt für Schritt mit der richtigen Strichreihenfolge üben.
    </p>

    <div style="display:flex;gap:8px;margin:14px 0;">
      <input id="charInput" type="text" inputmode="text" autocomplete="off"
        placeholder="z. B. 好"
        style="flex:1;font-size:22px;padding:12px 14px;border-radius:12px;
               border:1px solid var(--stroke);background:var(--card-strong);color:inherit;" />
      <button id="goBtn"
        style="font-size:18px;padding:12px 18px;border-radius:12px;border:none;
               background:var(--card-strong);outline:2px solid rgba(255,255,255,.26);color:inherit;">
        Los
      </button>
    </div>

    <p id="hint" style="opacity:.75;font-size:14px;">Mehrere Zeichen möglich – sie kommen nacheinander.</p>

    <div id="stage" style="display:none;">
      <p id="stageLine" style="margin:6px 0;opacity:.85;"></p>
      <div id="target"
        style="width:100%;max-width:300px;aspect-ratio:1;margin:8px auto;
               background:#ffffff;border-radius:16px;position:relative;"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;">
        <button id="restartBtn" style="padding:10px 16px;border-radius:12px;border:1px solid var(--stroke);background:transparent;color:inherit;">Nochmal</button>
      </div>
      <p id="feedback" style="text-align:center;margin-top:10px;min-height:1.4em;"></p>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let chars = [];
    let idx = 0;
    let writer = null;
    let token = 0;

    function extractHanzi(s){
      return [...s].filter(c => /[\u3400-\u9FFF]/.test(c));
    }

    function start(){
      chars = extractHanzi($("charInput").value);
      if(chars.length === 0){
        $("hint").textContent = "Bitte ein chinesisches Zeichen eingeben.";
        return;
      }
      idx = 0;
      $("stage").style.display = "block";
      render();
    }

    function render(){
      const ch = chars[idx];
      $("stageLine").textContent = `Zeichen ${idx+1} von ${chars.length}: ${ch}`;
      $("feedback").textContent = "";
      buildAndRun(ch);
    }

    function buildAndRun(ch){
      const target = $("target");
      target.innerHTML = "";
      token++;
      const myToken = token;

      // Zwei Ebenen: Quiz-Ebene (zum Nachzeichnen) + Hint-Ebene (zum Vormachen)
      const quizLayer = document.createElement("div");
      quizLayer.className = "zLayer";
      quizLayer.style.cssText = "position:absolute;inset:0;";
      const hintLayer = document.createElement("div");
      hintLayer.id = "zHintLayer";
      hintLayer.className = "zLayer";
      hintLayer.style.cssText = "position:absolute;inset:0;";
      target.appendChild(quizLayer);
      target.appendChild(hintLayer);

      try{
        writer = HanziWriter.create(quizLayer, ch, {
          width: target.clientWidth || 280,
          height: target.clientHeight || 280,
          padding: 14,
          showOutline: false,
          showCharacter: false,
          strokeColor: "#111111",
          radicalColor: "#c0392b",
          drawingColor: "#111111",
          drawingWidth: 26
        });
      }catch(e){
        $("feedback").textContent = "Für dieses Zeichen gibt es keine Strichdaten.";
        return;
      }
      // ersten Strich vormachen, dann Quiz starten
      showStroke(ch, 0, myToken, () => beginQuiz(ch, myToken));
    }

    // Zeigt einen einzelnen Strich auf der Hint-Ebene, danach leeren + Callback
    function showStroke(ch, strokeIndex, myToken, done){
      if(myToken !== token) return;
      const hintLayer = $("zHintLayer");
      if(!hintLayer){ done(); return; }
      hintLayer.innerHTML = "";
      $("feedback").textContent = `Schau dir Strich ${strokeIndex + 1} an …`;
      let hintWriter;
      try{
        hintWriter = HanziWriter.create(hintLayer, ch, {
          width: hintLayer.clientWidth || 280,
          height: hintLayer.clientHeight || 280,
          padding: 14,
          showOutline: false,
          showCharacter: false,
          strokeColor: "#111111",
          radicalColor: "#c0392b",
          drawingColor: "#111111",
          drawingWidth: 26
        });
      }catch(e){ done(); return; }
      const finish = () => {
        if(myToken !== token) return;
        setTimeout(() => { hintLayer.innerHTML = ""; done(); }, 180);
      };
      try{
        const result = hintWriter.animateStroke(strokeIndex);
        if(result && typeof result.then === "function") result.then(finish).catch(finish);
        else setTimeout(finish, 700);
      }catch(e){ finish(); }
    }

    function strokeCount(){
      try{ return writer?._character?.strokes?.length || 0; }catch(e){ return 0; }
    }
    function strokeNum(data){
      if(data && Number.isInteger(data.strokeNum)) return data.strokeNum;
      if(data && Number.isInteger(data.strokeIndex)) return data.strokeIndex;
      return null;
    }

    function beginQuiz(ch, myToken){
      if(myToken !== token) return;
      let completed = 0;
      $("feedback").textContent = "Zeichne Strich 1 nach …";
      writer.quiz({
        onMistake(){ if(myToken === token) $("feedback").textContent = "Nicht ganz – diesen Strich nochmal."; },
        onCorrectStroke(data){
          if(myToken !== token) return;
          const n = strokeNum(data);
          completed = n !== null ? Math.max(completed, n + 1) : completed + 1;
          const total = strokeCount();
          if(total && completed < total){
            setTimeout(() => showStroke(ch, completed, myToken, () => {
              if(myToken === token) $("feedback").textContent = `Zeichne Strich ${completed + 1} nach …`;
            }), 150);
          }
        },
        onComplete(){
          if(myToken !== token) return;
          if(chars.length > 1 && idx < chars.length - 1){
            $("feedback").textContent = "Geschafft. Weiter …";
            setTimeout(() => { idx++; render(); }, 900);
          } else {
            $("feedback").textContent = "Geschafft.";
          }
        }
      });
    }

    $("goBtn").addEventListener("click", start);
    $("charInput").addEventListener("keydown", e => { if(e.key === "Enter") start(); });
    $("restartBtn").addEventListener("click", render);
  </script>
</body>
</html>
