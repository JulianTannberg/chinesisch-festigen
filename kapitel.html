<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kapitel · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="topbar">
      <a class="back" href="index.html">← Kapitelübersicht</a>
      <div class="kicker" id="kicker">Kapitel</div>
    </div>
    <h1 id="title">Kapitel</h1>
    <p class="subtitle" id="short"></p>

    <section class="grid">
      <a class="modeCard" id="hearLink">
        <div class="modeIcon">🎧</div>
        <p class="modeTitle">Hören</p>
        <p class="modeText">Vokabeln antippen und Dialog/Geschichte mit langsamem Tempo anhören.</p>
      </a>
      <a class="modeCard" id="writeLink">
        <div class="modeIcon">✍️</div>
        <p class="modeTitle">Schreiben</p>
        <p class="modeText">Vokabeln aktiv schreiben, Fehler wiederholen und die Lernserie halten.</p>
      </a>
      <a class="modeCard" id="speakLink">
        <div class="modeIcon">🗣️</div>
        <p class="modeTitle">Sprechen</p>
        <p class="modeText">Den Schülerdialog mit KI als Gesprächspartner üben.</p>
      </a>
    </section>
  </main>

<script src="topics.js"></script>
<script>
function qs(name, fallback="01"){
  const p = new URLSearchParams(location.search);
  return (p.get(name) || fallback).padStart(2,"0");
}
function getTopic(){
  const id = qs("id");
  return (window.CF_TOPICS || []).find(t => t.id === id) || window.CF_TOPICS[0];
}
function applyTheme(topic){
  document.documentElement.style.setProperty("--chapter-bg", topic.accent);
  document.documentElement.style.setProperty("--accent", topic.accent);
  document.documentElement.style.setProperty("--chapter-text", topic.textColor || "#ffffff");
  document.title = `${topic.id}. ${topic.title} · Chinesisch festigen`;
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>

<script>
  const topic = getTopic();
  applyTheme(topic);
  document.getElementById("kicker").textContent = `Kapitel ${topic.id}`;
  document.getElementById("title").textContent = `${topic.id}. ${topic.title}`;
  document.getElementById("short").textContent = topic.short;
  document.getElementById("hearLink").href = `hoeren.html?id=${topic.id}`;
  document.getElementById("writeLink").href = `schreiben.html?id=${topic.id}`;
  document.getElementById("speakLink").href = `sprechen.html?id=${topic.id}`;
</script>
</body>
</html>
