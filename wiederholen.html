<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zeichen wiederholen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
  <style>
    .chapterCharRow{ margin:14px 0 20px; }
    .chapterCharHead{ display:inline-block; padding:6px 14px; border-radius:999px; font-weight:700; font-size:15px; margin-bottom:10px; }
    .charCells{ display:flex; flex-wrap:wrap; gap:10px; }
    .charCell{ min-width:56px; height:56px; font-size:26px; line-height:1; display:flex; align-items:center; justify-content:center; border:2px solid var(--stroke); border-radius:14px; background:var(--card); color:var(--chapter-text); cursor:pointer; padding:0 12px; }
    .charCell:hover{ background:var(--card-strong); }
    .charCell.done{ border-color:var(--good); box-shadow:0 0 0 2px var(--good) inset; }
    .charCell.locked{ opacity:.4; cursor:not-allowed; }
    .charCell.locked:hover{ background:var(--card); }
    .chapterCharRow.locked .chapterCharHead{ opacity:.75; }
    .lockHint{ font-size:13px; color:var(--muted); margin:-4px 0 9px; }
    .tipBox{ background:var(--card); border:1px solid var(--stroke); border-radius:14px; padding:12px 14px; margin:0 0 18px; }
    .tipBox p{ margin:0 0 10px; color:var(--muted); font-size:14px; line-height:1.5; }
    .tipDismiss{ min-height:38px; padding:7px 14px; border-radius:999px; border:1px solid var(--stroke); background:var(--button-bg); color:var(--chapter-text); font-size:14px; cursor:pointer; }
    .tipDismiss:hover{ background:var(--button-bg-hover); }
    .cfOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:60; padding:16px; }
    .cfOverlayCard{ background:#f4f6f8; color:#0f2233; border-radius:18px; padding:18px; width:min(340px,100%); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .practicePinyin{ font-size:24px; font-weight:700; margin-bottom:2px; }
    .practiceDe{ font-size:15px; color:#475569; margin-bottom:10px; }
    .writerTarget{ width:260px; height:260px; margin:0 auto; background:#fff; border-radius:14px; border:1px solid #d8dee4; }
    .practiceStatus{ margin:12px 0 14px; min-height:22px; font-weight:600; }
    .practiceStatus.ok{ color:#15803d; }
    .practiceStatus.bad{ color:#b91c1c; }
    .practiceButtons{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .practiceButtons button{ min-height:44px; padding:10px 16px; border-radius:999px; border:1px solid #cbd5e1; background:#fff; color:#0f2233; font-size:15px; cursor:pointer; }
    .practiceButtons button:hover{ background:#eef2f6; }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar topbarSticky" style="justify-content:space-between;">
      <a class="back" href="index.html">← Übersicht</a>
      <a class="miniBtn settingsIcon" href="einstellungen.html" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    </div>
    <h1 class="stickyHeading">Zeichen wiederholen</h1>
    <div id="tipBox" class="tipBox">
      <p>Tippe ein Wort an und schreib es aus dem Kopf – nur nach Pinyin und Bedeutung, ohne Hanzi-Vorlage. Es wird <strong>nur grün, wenn du es ohne Fehler schreibst</strong>. So oft du willst.</p>
      <button id="tipDismiss" class="tipDismiss" type="button">Verstanden ✓</button>
    </div>
    <div id="charMount"></div>
  </main>

  <div id="practiceOverlay" class="cfOverlay">
    <div class="cfOverlayCard">
      <div class="practicePinyin" id="practicePinyin">–</div>
      <div class="practiceDe" id="practiceDe"></div>
      <div id="writerTarget" class="writerTarget"></div>
      <div id="practiceStatus" class="practiceStatus">Schreib aus dem Kopf …</div>
      <div class="practiceButtons" style="flex-wrap:wrap;gap:8px;justify-content:center;">
        <button id="btnDemo" type="button">Vormachen</button>
        <button id="btnRedo" type="button">Nochmal</button>
        <button id="btnNext" type="button">Nächstes Zeichen</button>
        <button id="btnClose" type="button">Schließen</button>
      </div>
    </div>
  </div>

  <script src="topics.js"></script>
  <script src="bausteine.js"></script>
  <script src="common.js"></script>
  <script>
    const grid = document.getElementById("charMount");
    const allTopics = (window.CF_TOPICS || []);
    const contentTopics = allTopics.filter(t => t && topicHasContent(t));

    function wordChars(zh){ return String(zh || "").split("").filter(c => /[\u4e00-\u9fff]/.test(c)); }
    function chapterWords(t){
      const seen = new Set(), out = [];
      (t.vocab || []).forEach(v => {
        if(!v || !v.zh || seen.has(v.zh)) return;
        const chars = wordChars(v.zh);
        if(!chars.length) return;                 // ohne Hanzi (z. B. WiFi) überspringen
        seen.add(v.zh);
        out.push({ zh:v.zh, pinyin:v.pinyin || "", de:v.de || "", chars });
      });
      return out;
    }
    function chapterComplete(t){ return typeof cfChapterWorkedThrough === "function" ? cfChapterWorkedThrough(t) : false; }
    function doneKey(zh){ return "cf_review_done_" + zh; }
    function isDone(zh){ try{ return localStorage.getItem(doneKey(zh)) === "1"; }catch(e){ return false; } }
    function markDone(zh){
      try{ localStorage.setItem(doneKey(zh), "1"); }catch(e){}
      document.querySelectorAll(".charCell").forEach(el => {
        if(el.dataset.zh === zh && !el.classList.contains("locked")) el.classList.add("done");
      });
    }

    // Alle Kapitel mit Inhalt anlegen; Freischaltung wie in der Übersicht.
    // Flache Liste aller FREIGESCHALTETEN Wörter (in Grid-Reihenfolge) –
    // damit „Nächstes Zeichen" zum nächsten übbaren Wort springen kann.
    const practiceList = [];
    allTopics.forEach((t, i) => {
      if(!topicHasContent(t)) return;             // 7–15 ohne Inhalt: noch nicht anlegen
      const words = chapterWords(t);
      if(!words.length) return;
      const prev = i > 0 ? allTopics[i - 1] : null;
      const unlocked = !prev || chapterComplete(prev);

      const row = document.createElement("section");
      row.className = "chapterCharRow" + (unlocked ? "" : " locked");

      const head = document.createElement("div");
      head.className = "chapterCharHead";
      head.textContent = "Kapitel " + t.id + " · " + t.title + (unlocked ? "" : "  🔒");
      head.style.background = t.accent;
      head.style.color = t.textColor || "#fff";
      row.appendChild(head);

      if(!unlocked && prev){
        const hint = document.createElement("div");
        hint.className = "lockHint";
        hint.textContent = "Erst Kapitel " + prev.id + " abschließen";
        row.appendChild(hint);
      }

      const cells = document.createElement("div");
      cells.className = "charCells";
      words.forEach(w => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "charCell" + (unlocked && isDone(w.zh) ? " done" : "") + (unlocked ? "" : " locked");
        b.dataset.zh = w.zh;
        b.textContent = w.zh;
        b.style.borderColor = t.accent;
        if(unlocked){
          const listIndex = practiceList.length;
          practiceList.push(w);
          b.addEventListener("click", () => openPractice(w, listIndex));
        }
        else { b.disabled = true; }
        cells.appendChild(b);
      });
      row.appendChild(cells);
      grid.appendChild(row);
    });

    if(!contentTopics.length){
      grid.innerHTML = '<p class="subtitle">Noch keine Kapitel mit Inhalt vorhanden.</p>';
    }

    // ----- Hinweis-Box ausblenden (gemerkt) -----
    const tipBox = document.getElementById("tipBox");
    const TIP_KEY = "cf_review_tip_hidden";
    try{ if(localStorage.getItem(TIP_KEY) === "1") tipBox.style.display = "none"; }catch(e){}
    document.getElementById("tipDismiss").addEventListener("click", () => {
      tipBox.style.display = "none";
      try{ localStorage.setItem(TIP_KEY, "1"); }catch(e){}
    });

    // ----- Schreibübung: Prompt = Pinyin + Deutsch, kein Hanzi -----
    const overlay = document.getElementById("practiceOverlay");
    const pinyinEl = document.getElementById("practicePinyin");
    const deEl = document.getElementById("practiceDe");
    const statusEl = document.getElementById("practiceStatus");
    let curWord = null, curIdx = 0, curMistakes = 0, strokeMiss = 0, curWriter = null, curListIdx = -1;
    const WOPTS = {
      width:260, height:260, padding:12,
      showOutline:false, showCharacter:false,
      strokeColor:"#0f2233", radicalColor:"#c0392b",
      drawingColor:"#0f2233", drawingWidth:24,
      leniency:1.15, showHintAfterMisses:9999
    };
    function setStatus(t, cls){ statusEl.textContent = t; statusEl.className = "practiceStatus" + (cls ? (" " + cls) : ""); }
    function makeWriterForCurrent(){
      const target = document.getElementById("writerTarget");
      target.innerHTML = "";
      if(typeof HanziWriter === "undefined"){ setStatus("Schreib-Engine konnte nicht laden (offline?).", "bad"); return null; }
      curWriter = HanziWriter.create("writerTarget", curWord.chars[curIdx], WOPTS);
      return curWriter;
    }
    function quizCurrent(){
      if(!curWriter) return;
      strokeMiss = 0;
      const prog = curWord.chars.length > 1 ? (" (Zeichen " + (curIdx + 1) + "/" + curWord.chars.length + ")") : "";
      setStatus("Schreib aus dem Kopf" + prog + " …");
      curWriter.quiz({
        onMistake(){
          curMistakes++; strokeMiss++;
          if(strokeMiss % 3 === 0){ setStatus("Tipp: „Vormachen“ zeigt die Striche.", "bad"); }
          else{ setStatus("Nicht ganz – probier den Strich nochmal.", "bad"); }
        },
        onCorrectStroke(){ if(statusEl.classList.contains("bad")) setStatus("Weiter so …"); },
        onComplete(){
          if(curIdx < curWord.chars.length - 1){
            curIdx++;
            setStatus("Gut! Nächstes Zeichen …", "ok");
            setTimeout(() => { if(makeWriterForCurrent()) quizCurrent(); }, 420);
          }else{
            finishWord();
          }
        }
      });
    }
    function finishWord(){
      if(curMistakes === 0){ setStatus("Geschafft – ohne Fehler! ✓", "ok"); markDone(curWord.zh); }
      else{ setStatus("Geschafft, aber mit Fehlern. Für grün: „Nochmal“ ohne Fehler.", "bad"); }
    }
    function startAttempt(){ curIdx = 0; curMistakes = 0; if(makeWriterForCurrent()) quizCurrent(); }
    function openPractice(w, listIdx){
      curWord = w;
      curListIdx = (typeof listIdx === "number") ? listIdx : practiceList.indexOf(w);
      pinyinEl.textContent = w.pinyin || "—";
      deEl.textContent = w.de || "";
      overlay.style.display = "flex";
      document.documentElement.classList.add("noScroll");
      // „Nächstes Zeichen" nur anbieten, wenn es ein weiteres Wort gibt.
      const nextBtn = document.getElementById("btnNext");
      if(nextBtn) nextBtn.style.display = (curListIdx >= 0 && curListIdx < practiceList.length - 1) ? "" : "none";
      startAttempt();
    }
    // Zum nächsten freigeschalteten Wort springen (ohne Wertung – reines Weitergehen).
    function nextWord(){
      if(curListIdx < 0 || curListIdx >= practiceList.length - 1) return;
      const ni = curListIdx + 1;
      openPractice(practiceList[ni], ni);
    }
    function closePractice(){
      overlay.style.display = "none";
      document.documentElement.classList.remove("noScroll");
      const target = document.getElementById("writerTarget");
      if(target) target.innerHTML = "";
      curWriter = null;
    }
    document.getElementById("btnDemo").addEventListener("click", () => {
      if(!makeWriterForCurrent()) return;
      setStatus("Schau zu …");
      try{ curWriter.animateCharacter({ onComplete(){ if(makeWriterForCurrent()) quizCurrent(); } }); }
      catch(e){ quizCurrent(); }
    });
    document.getElementById("btnRedo").addEventListener("click", startAttempt);   // ganze Vokabel neu, Fehler zurückgesetzt
    document.getElementById("btnNext").addEventListener("click", nextWord);       // nächstes freigeschaltetes Wort
    document.getElementById("btnClose").addEventListener("click", closePractice);
    overlay.addEventListener("click", e => { if(e.target === overlay) closePractice(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape" && overlay.style.display === "flex") closePractice(); });
  </script>
</body>
</html>
