<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>18. Kultur &amp; Feste Erweiterungen</title>
  <style>
    :root {
      --bg:#f7f7f7;
      --card:#ffffff;
      --accent:#C2AD6E;
      --text:#111111;
      --muted:#666666;
      --shadow: rgba(0,0,0,0.10);
    }
    body{font-family:sans-serif;padding:16px;background:var(--bg);color:var(--text);}
    h1{font-size:20px;margin:8px 0 6px;}
    .nav{margin-bottom:10px;}
    a{color:var(--accent);text-decoration:none;}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;}
    .toolbar label{font-size:14px;}
    input[type="range"]{accent-color:var(--accent);}
    .btn{padding:10px 12px;border-radius:12px;border:none;cursor:pointer;background:var(--card);
          box-shadow:0 2px 6px var(--shadow);font-size:14px;color:var(--text);}
    .tabs{display:flex;gap:10px;margin:8px 0 14px;}
    .tab{flex:1;padding:12px;border-radius:12px;background:var(--card);box-shadow:0 2px 6px var(--shadow);
          text-align:center;cursor:pointer;user-select:none;font-size:14px;}
    .tab.active{outline:2px solid var(--accent);}
    .panel{display:none;}
    .panel.active{display:block;}
    .twoCol{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .colTitle{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;}
    .stack{display:grid;gap:12px;}
    .card,.sentence{background:var(--card);border-radius:12px;box-shadow:0 2px 6px var(--shadow);
      cursor:pointer;user-select:none;min-height:96px;display:flex;align-items:center;justify-content:center;
      text-align:center;padding:12px;}
    .card{font-size:40px;}
    .sentence{font-size:22px;line-height:1.25;word-break:break-word;}
    .dialogMeta{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:0 2px 6px var(--shadow);
      margin-bottom:10px;cursor:pointer;}
    .dialogTitle{font-size:18px;margin:0 0 4px;font-weight:600;}
    .dialogSituation{font-size:13px;color:var(--muted);margin:0;line-height:1.35;}
    .dialog{display:grid;gap:10px;}
    .line{background:var(--card);border-radius:12px;padding:14px;cursor:pointer;user-select:none;
      box-shadow:0 2px 6px var(--shadow);font-size:22px;line-height:1.25;}
    .hint{color:var(--muted);font-size:13px;margin-top:12px;}
  
    @media (max-width: 420px){
      .card, .sentence{ font-size: 20px; padding: 14px; }
    }

/* Orientierung: Hochkant = untereinander, Querformat = nebeneinander */
.pairGrid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px 16px;
}
@media (orientation: portrait){
  .pairGrid{
    grid-template-columns: 1fr;
  }
}

@media (orientation: landscape){
  .pairGrid{
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  }
}

/* Scroll-to-top */
    #toTop{
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    #toTop:active{ transform: translateY(1px); }

    /* Toolbar: im Hochformat sauber umbrechen (Stop + Alles abspielen zusammen) */
    .toolbar{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .btnGroup{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: nowrap;
    }
    @media (max-width: 640px){
      .toolbar{ grid-template-columns: 1fr; }
      .btnGroup{ justify-content: flex-start; flex-wrap: wrap; }
      #playAllBtn{ flex: 1 1 auto; }
    }

    .stickyHeader::after{
      content:"";
      display:block;
      height:1px;
      background: rgba(0,0,0,0.10);
      margin-top: 10px;
    }

    /* Ensure sticky isn't broken by ancestor overflow */
    html, body { overflow-x: hidden; }

    /* Toolbar wrapping: keep Stop + PlayAll together */
    .btnGroup{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
    }
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap: wrap;
      align-items:center;
    }

    /* Fixed Header (robust across devices) */
    .appHeader{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--bg);
      padding: 8px 16px 10px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.10);
    }
    body{
      padding-top: var(--headerH, 160px);
    }
    /* keep max width centered like before */
    .appHeader > *{ max-width: 980px; margin: 0 auto; }
</style>
</head>
<body>
  <header id="appHeader" class="appHeader">
  <div class="nav"><a href="audio_index.html">← Zur Themenübersicht</a></div>
  <h1>18. Kultur &amp; Feste Erweiterungen</h1>

  <div class="stickyTop"><div class="toolbar">
    <label>
      Sprechtempo:
      <input type="range" id="tempo" min="0.4" max="1.2" step="0.1" value="1.0">
      <span id="tempoWert">1.0</span>
    </label>
    <div class="btnGroup">
      <button class="btn" id="stopBtn" type="button">Stopp</button>
      <button class="btn" id="playAllBtn" type="button">Dialog: alles abspielen</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="vokabeln">Vokabeln</div>
    <div class="tab" data-tab="dialog">Dialog</div>
  </div>
</header>

  <main id="appMain">
  <div id="panel-vokabeln" class="panel active">
    <div class="pairGrid" id="pairGrid"></div>
    <div class="hint">Antippen = Audio</div>
  </div>

  <div id="panel-dialog" class="panel">
    <div class="dialogMeta" id="dialogMeta">
      <p class="dialogTitle" id="dialogTitel"></p>
      <p class="dialogSituation" id="dialogSituation"></p>
    </div>
    <div id="dialog" class="dialog"></div>
    <div class="hint">Zeile antippen oder alles abspielen</div>
  </div>
  </main>

  <button id="toTop" type="button" aria-label="Nach oben">↑</button>

  <script>

    const vokabelnNur = ["文化", "传统", "节日", "习俗", "庆祝", "活动", "历史", "意义", "仪式", "表演", "服装", "音乐", "舞蹈", "艺术", "参观", "展览", "博物馆", "风俗", "宗教", "信仰", "交流", "体验"];
    const saetzeNur = ["了解文化很重要。", "这是中国的传统节日。", "春节是最重要的节日。", "各地的习俗不一样。", "大家一起庆祝生日。", "节日期间有很多活动。", "这个节日有很长的历史。", "这个节日意义特别。", "婚礼上有很多仪式。", "晚上有精彩的表演。", "表演者穿着传统服装。", "音乐让节日更热闹。", "她很喜欢民族舞蹈。", "中国艺术历史悠久。", "我们参观了博物馆。", "这里正在举办展览。", "博物馆里有很多文物。", "了解当地风俗很重要。", "宗教也是文化的一部分。", "每个人的信仰不同。", "文化交流很有意义。", "这是一次难忘的文化体验。"];
    const dialogTitel = "你对中国文化了解多吗？";
    const dialogSituation = "了解文化";
    const dialog = ["你对中国文化了解多吗？", "还不算多，但是很感兴趣。", "你参加过中国的传统节日吗？", "参加过中秋节。", "感觉怎么样？", "很有意思，也学到了很多。", "文化活动能拉近人。", "是的，也更容易交流。", "以后想多参加一些。", "这样对生活也有帮助。"];

    const tempoEl = document.getElementById("tempo");
    const tempoWertEl = document.getElementById("tempoWert");
    tempoWertEl.textContent = tempoEl.value;
    tempoEl.oninput = () => tempoWertEl.textContent = tempoEl.value;

    let zhVoice = null;
    function pickVoice() {
      const v = speechSynthesis.getVoices();
      zhVoice = v.find(x => (x.lang || "").toLowerCase().startsWith("zh")) || null;
    }
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;

    let playAllAbort = 0;
    function stopAllAudio() {
      playAllAbort++;
      speechSynthesis.cancel();
    }

    function sprich(text) {
      stopAllAudio();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = parseFloat(tempoEl.value);
      if (zhVoice) u.voice = zhVoice;
      speechSynthesis.speak(u);
    }
    document.getElementById("stopBtn").onclick = stopAllAudio;

    const tabs = Array.from(document.querySelectorAll(".tab"));
    function activateTab(tabName) {
      tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === tabName));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.getElementById("panel-" + tabName).classList.add("active");
    }
    tabs.forEach(t => t.onclick = () => activateTab(t.dataset.tab));

    const pairGrid = document.getElementById("pairGrid");

    const maxLen = Math.max(vokabelnNur.length, saetzeNur.length);
    for (let i = 0; i < maxLen; i++) {
      const v = vokabelnNur[i] ?? "";
      const s = saetzeNur[i] ?? "";

      const left = document.createElement("div");
      left.className = "card";
      left.textContent = v || "–";
      left.onclick = () => v && sprich(v);

      const right = document.createElement("div");
      right.className = "sentence";
      right.textContent = s || "–";
      right.onclick = () => s && sprich(s);

      pairGrid.appendChild(left);
      pairGrid.appendChild(right);
    }


    document.getElementById("dialogTitel").textContent = (dialogTitel && dialogTitel.trim()) ? dialogTitel : "Dialog";
    document.getElementById("dialogSituation").textContent = dialogSituation;

    document.getElementById("dialogMeta").onclick = () => {
      const text = dialogSituation ? (dialogTitel + "。" + dialogSituation) : dialogTitel;
      sprich(text);
    };

    const dialogEl = document.getElementById("dialog");
    dialog.forEach(l => {
      const d = document.createElement("div");
      d.className = "line";
      d.textContent = l;
      d.onclick = () => sprich(l);
      dialogEl.appendChild(d);
    });

    function speakAndWait(text, token) {
      return new Promise(resolve => {
        if (token !== playAllAbort) return resolve();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-CN";
        u.rate = parseFloat(tempoEl.value);
        if (zhVoice) u.voice = zhVoice;
        const done = () => resolve();
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
      });
    }

    async function playAll() {
      activateTab("dialog");
      stopAllAudio();
      const token = playAllAbort;

      const metaText = dialogSituation ? (dialogTitel + "。" + dialogSituation) : dialogTitel;
      if (metaText.trim()) {
        await speakAndWait(metaText, token);
        if (token !== playAllAbort) return;
      }

      for (const l of dialog) {
        if (token !== playAllAbort) break;
        await speakAndWait(l, token);
        if (token !== playAllAbort) break;
      }
    }
    document.getElementById("playAllBtn").onclick = playAll;

  
    // Nach oben Button
    const toTopBtn = document.getElementById("toTop");
    window.addEventListener("scroll", () => {
      const y = window.scrollY || document.documentElement.scrollTop;
      toTopBtn.style.display = y > 500 ? "flex" : "none";
    }, { passive: true });

    toTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function setHeaderH(){
      const h = document.getElementById("appHeader");
      if(!h) return;
      const px = h.offsetHeight + 12;
      document.documentElement.style.setProperty("--headerH", px + "px");
    }
    window.addEventListener("load", setHeaderH);
    window.addEventListener("resize", setHeaderH);
</script>

<button id="scrollTopBtn" aria-label="Nach oben" style="
position:fixed;
right:16px;
bottom:16px;
width:48px;
height:48px;
border-radius:24px;
border:none;
background:#334155;
color:white;
font-size:22px;
box-shadow:0 6px 18px rgba(0,0,0,.35);
display:none;
z-index:50;
">↑</button>
<script>
const stBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll',()=>{
  stBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
stBtn.addEventListener('click',()=>{
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
