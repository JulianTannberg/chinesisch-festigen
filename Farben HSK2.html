<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farben HSK2</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f7f7f7; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      background: white; border-radius: 12px; padding: 18px;
      text-align: center; font-size: 40px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      user-select: none;
    }
    .hint { color: #666; font-size: 13px; margin-top: 10px; }
    .nav { margin-bottom: 12px; }
    a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="nav"><a href="index.html">← Zur Themenübersicht</a></div>
  <h1>Farben HSK2</h1>

  <div id="grid" class="grid"></div>
  <div class="hint">Tippen Sie auf ein Zeichen, um es zu hören.</div>

  <script>
    // NUR HIER pflegen Sie Ihre Zeichen:
    const vokabeln = ["红", "这是红苹果。", "白", "我的车是白的。", "黑", "我喜欢黑色的衣服。", "黄", "太阳是黄的。", "蓝", "天空是蓝色的。", "这是我的家。这是白色的门。我的妈妈有黑色的头发。我的爸爸有一辆蓝色的车。我的杯子是红色的。我喜欢它。看！那是我的小猫。它是黄色的。我家的桌子是棕色的，很大。天空今天不是灰色的，是蓝色的！很多颜色都很好看。"];

    function sprich(text) {
      // laufende Sprachausgabe stoppen, damit es nicht überlappt
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      speechSynthesis.speak(u);
    }

    const grid = document.getElementById("grid");
    vokabeln.forEach(z => {
      const el = document.createElement("div");
      el.className = "card";
      el.textContent = z;
      el.onclick = () => sprich(z);
      grid.appendChild(el);
    });
  </script>
</body>
</html>
