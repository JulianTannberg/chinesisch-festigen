<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chinesisch" />
</head>
<body>
  <main class="app">
    <h1>Kapitelübersicht</h1>
    <p class="subtitle">Wähle ein Kapitel. Danach findest du Hören, Schreiben und Sprechen passend zum Thema.</p>
    <div id="profileSetupMount"></div>
    <section class="grid" id="chapterGrid"></section>
    <div id="profileEditMount" class="bottomProfile"></div>
  </main>

  <script src="topics.js"></script>
  <script src="common.js"></script>
  <script src="profile.js"></script>
  <script>
    window.CF_PROFILE?.mountSetup("profileSetupMount");
    window.CF_PROFILE?.mountEdit("profileEditMount");
    const grid = document.getElementById("chapterGrid");
    (window.CF_TOPICS || []).forEach(t => {
      const ready = topicHasContent(t);
      const el = document.createElement(ready ? "a" : "div");
      el.className = "chapterCard" + (ready ? "" : " locked");
      if(ready) el.href = `kapitel.html?id=${t.id}`;
      el.style.background = `linear-gradient(135deg, ${t.accent}, rgba(255,255,255,.14))`;
      el.style.color = t.textColor;
      el.innerHTML = `
        <div class="chapterNo">Kapitel ${t.id}</div>
        <div class="chapterTitle">${escapeHtml(t.title)}</div>
        <p class="chapterShort">${escapeHtml(t.short)}</p>
        ${ready ? "" : `<span class="soonBadge">Bald verfügbar</span>`}
      `;
      grid.appendChild(el);
    });
  </script>
</body>
</html>
