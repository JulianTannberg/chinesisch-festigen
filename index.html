<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css?v=143" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chinesisch" />
  <style>
    /* v143: Alle vier Schaltflächen bleiben vollständig im unteren Balken. */
    .homeNav{
      box-sizing:border-box!important;
      height:calc(82px + env(safe-area-inset-bottom,0px))!important;
      min-height:calc(82px + env(safe-area-inset-bottom,0px))!important;
      max-height:calc(82px + env(safe-area-inset-bottom,0px))!important;
      grid-template-columns:repeat(4,minmax(0,1fr))!important;
      grid-auto-rows:66px!important;
      align-items:stretch!important;
      padding:7px 8px calc(9px + env(safe-area-inset-bottom,0px))!important;
      overflow:hidden!important;
    }
    .homeNavItem{
      box-sizing:border-box!important;
      height:66px!important;
      min-height:66px!important;
      max-height:66px!important;
      align-self:stretch!important;
      justify-content:center!important;
      gap:2px!important;
      padding:3px 2px 5px!important;
      margin:0!important;
      overflow:hidden!important;
    }
    .homeNavIcon{
      flex:0 0 31px!important;
      width:31px!important;
      height:31px!important;
    }
    .homeNavItem>span:last-child{
      display:block;
      flex:0 0 auto;
      max-width:100%;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .homeWithNav{
      padding-bottom:calc(102px + env(safe-area-inset-bottom,0px))!important;
    }
  </style>
</head>
<body>
  <main class="app homeWithNav">
    <header class="homeHeader">
      <div>
        <div class="kicker">CHINESISCH FESTIGEN</div>
        <h1 class="pageTitleResponsive">Kapitelübersicht</h1>
        <p class="subtitle">Wähle ein Kapitel oder nutze unten Zeichen, Spiele und Profil.</p>
      </div>
    </header>

    <section class="grid" id="chapterGrid"></section>
    <section id="storyMount" class="storyUnlockSection" aria-label="Abschlussgeschichte"></section>
  </main>

  <nav class="homeNav" aria-label="Hauptbereiche">
    <a class="homeNavItem active" href="index.html" aria-current="page">
      <span class="homeNavIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>
      </span>
      <span>Kapitel</span>
    </a>
    <a class="homeNavItem" href="wiederholen.html">
      <span class="homeNavIcon homeNavHanzi" aria-hidden="true">汉</span>
      <span>Zeichen</span>
    </a>
    <a class="homeNavItem" href="spiele.html">
      <span class="homeNavIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 8h10a5 5 0 0 1 4.7 6.7l-1 2.8a2.8 2.8 0 0 1-4.8.8L14.6 17H9.4l-1.3 1.3a2.8 2.8 0 0 1-4.8-.8l-1-2.8A5 5 0 0 1 7 8Z"/><path d="M7 12v4M5 14h4M16.5 13.5h.01M19 15.5h.01"/></svg>
      </span>
      <span>Spiele</span>
    </a>
    <a class="homeNavItem" href="profil.html">
      <span class="homeNavIcon homeProfileIcon" id="homeProfileIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </span>
      <span>Profil</span>
    </a>
  </nav>

  <script src="topics.js?v=143"></script>
  <script src="bausteine.js?v=143"></script>
  <script src="config.js?v=143"></script>
  <script src="sync.js?v=143"></script>
  <script src="common.js?v=143"></script>
  <script>
    if(window.CF_SYNC && CF_SYNC.initialSync){
      CF_SYNC.initialSync.then(() => {
        if(CF_SYNC.getState().needsRefresh) location.reload();
      });
    }

    const grid = document.getElementById("chapterGrid");
    const topics = window.CF_TOPICS || [];
    const scoreNames = window.CF_SCORE_NAMES || [];

    function chapterTotal(t){ return cfChapterPercent(t); }
    function chapterStarted(t){ return scoreNames.some(n => cfGetScore(n, t.id) !== null); }
    function chapterWorked(t){ return cfChapterWorkedThrough(t); }

    topics.forEach((t, i) => {
      if(typeof cfMigrateProgressV2 === "function") cfMigrateProgressV2(t);
      const hasContent = topicHasContent(t);
      const prev = i > 0 ? topics[i-1] : null;
      const prevDone = !prev || chapterWorked(prev);
      const available = hasContent && prevDone;

      const el = document.createElement(available ? "a" : "div");
      el.className = "chapterCard" + (available ? "" : " locked");
      if(available) el.href = `kapitel.html?id=${t.id}`;
      el.style.background = t.accent;
      el.style.color = t.textColor;

      let scoreHtml = "";
      if(hasContent){
        const total = chapterTotal(t);
        if(total !== null && chapterStarted(t)){
          if(total >= 100) el.classList.add("complete");
          scoreHtml = `
            <div class="chapterScore">${total} %</div>
            <div class="chapterBar"><div style="width:${total}%"></div></div>
          `;
        }
      }

      let badge = "";
      if(!hasContent) badge = `<span class="soonBadge">Bald verfügbar</span>`;
      else if(!available) badge = `<span class="soonBadge">🔒 Erst Kapitel ${prev.id} durcharbeiten</span>`;

      el.innerHTML = `
        <div class="chapterNo">Kapitel ${t.id}</div>
        <div class="chapterTitle">${escapeHtml(t.title)}</div>
        <p class="chapterShort">${escapeHtml(t.short)}</p>
        ${badge}
        ${scoreHtml}
      `;
      grid.appendChild(el);
    });

    const storyMount = document.getElementById("storyMount");
    const testMode = new URLSearchParams(location.search).get("test") === "1";
    const storyProgress = cfStoryProgress(topics);
    const storyUnlocked = cfStoryUnlocked(topics) || testMode;
    const storyCard = document.createElement(storyUnlocked ? "a" : "div");
    storyCard.className = "storyUnlockCard" + (storyUnlocked ? " available" : " locked");
    if(storyUnlocked) storyCard.href = "geschichte.html" + (testMode ? "?test=1" : "");
    storyCard.innerHTML = `
      <div class="storyUnlockEyebrow">Nach Kapitel 15</div>
      <div class="storyUnlockBody">
        <div>
          <div class="storyUnlockZh">完整的故事</div>
          <h2>Die Geschichte auf Chinesisch</h2>
          <p>Sū Ráns Reise durch Beijing – in 15 kurzen Lesekapiteln.</p>
        </div>
        <div class="storyUnlockAction">${storyUnlocked ? "Jetzt lesen ›" : "🔒 Noch gesperrt"}</div>
      </div>
      <div class="storyUnlockProgress">
        <span>${storyProgress.done} von 15 Kapiteln einmal durchgearbeitet</span>
        <div class="storyUnlockBar"><i style="width:${Math.round(storyProgress.done / 15 * 100)}%"></i></div>
      </div>
      ${storyUnlocked ? "" : '<p class="storyUnlockHint">Die Geschichte wird freigeschaltet, sobald du jedes Kapitel einmal vollständig durchgearbeitet hast.</p>'}
    `;
    storyMount.appendChild(storyCard);

    function paintProfile(state){
      const icon = document.getElementById("homeProfileIcon");
      if(!icon) return;
      const email = state && state.signedIn && state.user ? (state.user.email || "") : "";
      if(email){
        icon.textContent = email.trim().charAt(0).toUpperCase() || "✓";
        icon.classList.add("signedIn");
      }
    }
    window.addEventListener("cf-sync-status", e => paintProfile(e.detail));
    if(window.CF_SYNC && CF_SYNC.ready) CF_SYNC.ready.then(() => paintProfile(CF_SYNC.getState()));
  </script>
</body>
</html>
