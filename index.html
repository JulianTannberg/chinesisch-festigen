<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chinesisch festigen – Start</title>
  <style>
    :root{
      --bg:#f7f7f7;
      --card:#ffffff;
      --text:#111111;
      --muted:#666666;
      --shadow: rgba(0,0,0,0.10);
      --stroke: rgba(0,0,0,0.10);
      --accent:#5F9EA0;
    }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
      max-width: 980px;
      margin-left:auto;
      margin-right:auto;
    }
    h1{font-size:20px;margin:6px 0 14px;}
    .grid{display:grid;gap:14px;}
    @media (min-width:720px){ .grid{grid-template-columns: repeat(3, 1fr);} }
    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: 14px;
      box-shadow: 0 2px 10px var(--shadow);
      padding: 14px;
      text-decoration:none;
      color: inherit;
      display:block;
    }
    .card:hover{ box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
    .kicker{color:var(--muted);font-size:13px;margin:0 0 6px;}
    .title{font-size:16px;font-weight:800;margin:0;}
    .sub{color:var(--muted);font-size:13px;margin:8px 0 0;line-height:1.35;}
    .bar{height:8px;border-radius:999px;background:var(--accent);margin-bottom:10px;opacity:.85;}
  </style>
</head>
<body>
  <h1>Übungsbereiche</h1>

  <div class="grid">
    <a class="card" href="hoeren/index.html">
      <div class="bar"></div>
      <p class="kicker">Hören</p>
      <p class="title">Hörübungen</p>
      <p class="sub">Audio & Dialoge pro Thema.</p>
    </a>

    <a class="card" href="schreiben/index.html">
      <div class="bar"></div>
      <p class="kicker">Schreiben</p>
      <p class="title">Schreibübungen</p>
      <p class="sub">Übersetzen & Wiederholen.</p>
    </a>

    <a class="card" href="sprechen/index.html">
      <div class="bar"></div>
      <p class="kicker">Sprechen</p>
      <p class="title">KI‑Sprechübungen</p>
      <p class="sub">Starttext kopieren und in ChatGPT nutzen.</p>
    </a>
  </div>
</body>
</html>
