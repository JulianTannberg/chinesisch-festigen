<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="theme-color" content="#03172B" />

  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-title" content="Chinesisch" />
</head>
<body>
  <main class="app">
    <div class="topbar topbarEnd topbarSticky">
      <div class="topbarIcons">
        <a class="miniBtn settingsIcon gameIcon" href="jump-run.html?id=01" aria-label="Bonusspiel: Su Rans Reise" title="Bonusspiel: Su Rans Reise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg></a>
        <a class="miniBtn settingsIcon hanziBtn" href="wiederholen.html" aria-label="Zeichen wiederholen" title="Zeichen wiederholen">汉字</a>
        <a class="miniBtn settingsIcon hanziBtn" href="zeichen.html" aria-label="Zeichen nachzeichnen" title="Zeichen eingeben und nachzeichnen">写</a>
        <a class="miniBtn settingsIcon" href="einstellungen.html" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      </div>
    </div>
    <h1>Kapitelübersicht</h1>
    <div id="profileSetupMount"></div>
    <section class="grid" id="chapterGrid"></section>
    <section id="storyMount" class="storyUnlockSection" aria-label="Abschlussgeschichte"></section>
    <div id="profileEditMount" class="bottomProfile"></div>
  </main>

  <script src="topics.js"></script>
  <script src="bausteine.js"></script>
  <script src="common.js"></script>
  <script src="profile.js"></script>
  <script>
    window.CF_PROFILE?.mountSetup("profileSetupMount");
    window.CF_PROFILE?.mountEdit("profileEditMount");
    const grid = document.getElementById("chapterGrid");
    const topics = window.CF_TOPICS || [];
    const scoreNames = ["hoeren","lernen","tippen","schreibtraining","sprechen","ueben_hoeren","ueben_zhde","ueben_dezh","flash","memory","luecken"];

    // Gesamt-Prozent eines Kapitels: nicht gespielte Aktivitäten zählen als 0
    // (zentrale Rechnung aus common.js). null nur bei Kapiteln ganz ohne Inhalt.
    function chapterTotal(t){
      return cfChapterPercent(t);
    }
    function chapterStarted(t){
      return scoreNames.some(n => cfGetScore(n, t.id) !== null);
    }
    function chapterComplete(t){
      const tot = chapterTotal(t);
      return tot !== null && tot >= 100;
    }
    // Freischaltung des nächsten Kapitels: nicht mehr 100 %, sondern „komplett
    // durchgearbeitet" – jede prozentgebende Aktivität wurde einmal gespielt
    // (egal ob richtig oder falsch).
    function chapterWorked(t){
      return cfChapterWorkedThrough(t);
    }

    topics.forEach((t, i) => {
      const hasContent = topicHasContent(t);
      // Freischaltung: Kapitel 1 immer offen; jedes weitere erst, wenn das
      // vorherige Kapitel komplett durchgearbeitet wurde.
      const prev = i > 0 ? topics[i-1] : null;
      const prevDone = !prev || chapterWorked(prev);
      const available = hasContent && prevDone;

      const el = document.createElement(available ? "a" : "div");
      el.className = "chapterCard" + (available ? "" : " locked");
      if(available) el.href = `kapitel.html?id=${t.id}`;
      el.style.background = `linear-gradient(135deg, ${t.accent}, rgba(255,255,255,.14))`;
      el.style.color = t.textColor;

      // Fortschritt nur anzeigen, wenn das Kapitel Inhalt hat
      let scoreHtml = "";
      if(hasContent){
        const total = chapterTotal(t);
        if(total !== null && chapterStarted(t)){
          if(total >= 100) el.classList.add("complete");
          scoreHtml = `
            <div class="chapterScore">${total} %</div>
            <div class="chapterBar"><div style="width:${total}%"></div></div>
          `;
        }
      }

      // Badge: ohne Inhalt = bald; mit Inhalt aber gesperrt = vorheriges Kapitel abschließen
      let badge = "";
      if(!hasContent) badge = `<span class="soonBadge">Bald verfügbar</span>`;
      else if(!available) badge = `<span class="soonBadge">🔒 Erst Kapitel ${prev.id} abschließen</span>`;

      el.innerHTML = `
        <div class="chapterNo">Kapitel ${t.id}</div>
        <div class="chapterTitle">${escapeHtml(t.title)}</div>
        <p class="chapterShort">${escapeHtml(t.short)}</p>
        ${badge}
        ${scoreHtml}
      `;
      grid.appendChild(el);
    });

    // Abschlussgeschichte unter Kapitel 15. Zum Testen kann sie mit ?test=1
    // geöffnet werden, ohne den echten Lernfortschritt zu verändern.
    const storyMount = document.getElementById("storyMount");
    const testMode = new URLSearchParams(location.search).get("test") === "1";
    const storyProgress = cfStoryProgress(topics);
    const storyUnlocked = cfStoryUnlocked(topics) || testMode;
    const storyCard = document.createElement(storyUnlocked ? "a" : "div");
    storyCard.className = "storyUnlockCard" + (storyUnlocked ? " available" : " locked");
    if(storyUnlocked) storyCard.href = "geschichte.html" + (testMode ? "?test=1" : "");
    storyCard.innerHTML = `
      <div class="storyUnlockEyebrow">Nach Kapitel 15</div>
      <div class="storyUnlockBody">
        <div>
          <div class="storyUnlockZh">完整的故事</div>
          <h2>Die Geschichte auf Chinesisch</h2>
          <p>Sū Ráns Reise durch Beijing – in 15 kurzen Lesekapiteln.</p>
        </div>
        <div class="storyUnlockAction">${storyUnlocked ? "Jetzt lesen ›" : "🔒 Noch gesperrt"}</div>
      </div>
      <div class="storyUnlockProgress">
        <span>${storyProgress.done} von 15 Kapiteln einmal durchgearbeitet</span>
        <div class="storyUnlockBar"><i style="width:${Math.round(storyProgress.done / 15 * 100)}%"></i></div>
      </div>
      ${storyUnlocked ? "" : '<p class="storyUnlockHint">Die Geschichte wird freigeschaltet, sobald du jedes Kapitel einmal vollständig durchgearbeitet hast. 100&nbsp;% sind dafür nicht nötig.</p>'}
    `;
    storyMount.appendChild(storyCard);
  </script>
</body>
</html>
