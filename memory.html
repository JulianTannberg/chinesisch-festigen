<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Memory · Chinesisch festigen</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#03172B" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
</head>
<body>
  <main class="app memoryApp">
    <div class="topbar topbarSticky"><a class="back" href="spiele.html">← Zurück</a></div>
    <h1 class="pageTitleResponsive">Memory</h1>
    <p class="subtitle">Wähle die Kapitel aus. Jede neue Runde mischt andere Vokabeln aus deiner Auswahl.</p>

    <section class="card" id="setupCard">
      <div class="setTitle">Kapitel auswählen</div>
      <div class="toolbar">
        <button id="selectAll" type="button">Alle verfügbaren</button>
        <button id="clearAll" type="button">Auswahl löschen</button>
      </div>
      <div class="memoryChapterPicker" id="chapterPicker"></div>
      <p class="small" id="selectionInfo">Noch kein Kapitel ausgewählt.</p>
      <button id="startGame" type="button" disabled>Memory starten</button>
    </section>

    <section class="card" id="gameCard" hidden>
      <div class="memTopRow">
        <div class="memStats">
          <div class="memStat">Runde <strong id="roundNo">1</strong></div>
          <div class="memStat">Paare <strong id="pairCount">0/0</strong></div>
          <div class="memStat">Züge <strong id="moveCount">0</strong></div>
        </div>
        <div class="memActions">
          <button id="soundToggle" type="button">Ton an</button>
          <button id="changeSelection" type="button">Kapitel ändern</button>
        </div>
      </div>

      <div class="memoryGrid" id="memoryGrid" aria-label="Memory-Karten"></div>

      <div class="memoryRoundDone" id="roundDone" hidden>
        <strong>Runde geschafft!</strong>
        <span id="roundDoneText"></span>
        <button id="nextRound" type="button">Neue Runde →</button>
      </div>
    </section>
  </main>

<script src="topics.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="common.js"></script>
<script>
const topics = (window.CF_TOPICS || []).filter(t => (t.vocab || []).some(v => v && v.zh && v.de));
const $ = id => document.getElementById(id);
const selected = new Set();
let pool = [];
let cards = [];
let openCards = [];
let locked = false;
let pairsFound = 0;
let moves = 0;
let roundNo = 1;
let soundOn = localStorage.getItem("cf_memory_global_sound") !== "0";
const PAIRS_PER_ROUND = 6;

function shuffleLocal(list){
  const a = list.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function writeZh(v){ return v.writeZh || v.zh || ""; }
function writeDe(v){ return v.writeDe || v.de || ""; }
function updateSoundButton(){
  $("soundToggle").textContent = soundOn ? "Ton an" : "Ton aus";
  $("soundToggle").classList.toggle("active",soundOn);
}
function speakZh(text){ if(soundOn && text) cfSpeakZh(text,{rate:.85}); }

function saveSelection(){
  try{ localStorage.setItem("cf_memory_selected_chapters_v2",JSON.stringify([...selected])); }catch(e){}
}
function loadSelection(){
  try{
    const saved=JSON.parse(localStorage.getItem("cf_memory_selected_chapters_v2")||"[]");
    saved.forEach(id=>{if(topics.some(t=>t.id===id))selected.add(id);});
  }catch(e){}
  if(!selected.size && topics[0]) selected.add(topics[0].id);
}
function renderPicker(){
  const mount=$("chapterPicker"); mount.innerHTML="";
  topics.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="memoryChapterChoice"; b.dataset.id=t.id;
    b.classList.toggle("active",selected.has(t.id));
    b.innerHTML=`<strong>Kapitel ${escapeHtml(t.id)}</strong><span>${escapeHtml(t.title)}</span>`;
    b.addEventListener("click",()=>{
      if(selected.has(t.id))selected.delete(t.id);else selected.add(t.id);
      saveSelection();renderPicker();
    });
    mount.appendChild(b);
  });
  const count=topics.filter(t=>selected.has(t.id)).reduce((n,t)=>n+(t.vocab||[]).filter(v=>v&&v.zh&&v.de).length,0);
  $("selectionInfo").textContent=selected.size?`${selected.size} Kapitel · ${count} Vokabeln verfügbar`:"Noch kein Kapitel ausgewählt.";
  $("startGame").disabled=count<2;
}
function buildPool(){
  pool=[];
  topics.filter(t=>selected.has(t.id)).forEach(t=>{
    (t.vocab||[]).filter(v=>v&&v.zh&&v.de).forEach((v,i)=>pool.push({...v,_chapter:t.id,_key:`${t.id}_${i}_${v.zh}`}));
  });
}
function makeRound(){
  buildPool();
  if(pool.length<2)return;
  const picks=shuffleLocal(pool).slice(0,Math.min(PAIRS_PER_ROUND,pool.length));
  cards=shuffleLocal(picks.flatMap((v,i)=>[
    {id:`${Date.now()}_${i}_zh`,pair:i,type:"zh",text:writeZh(v),open:false,matched:false},
    {id:`${Date.now()}_${i}_de`,pair:i,type:"de",text:writeDe(v),open:false,matched:false}
  ]));
  openCards=[];locked=false;pairsFound=0;moves=0;
  $("roundDone").hidden=true;
  renderGame();
}
function renderGame(){
  updateSoundButton();
  $("roundNo").textContent=String(roundNo);
  $("pairCount").textContent=`${pairsFound}/${cards.length/2}`;
  $("moveCount").textContent=String(moves);
  const grid=$("memoryGrid");grid.innerHTML="";
  cards.forEach(card=>{
    const b=document.createElement("button");b.type="button";
    b.className="memoryCard"+((card.open||card.matched)?" open":"")+(card.matched?" matched":"");
    if(card.type==="zh")b.classList.add("zhCard");
    b.innerHTML=(card.open||card.matched)?`<span class="memoryText">${escapeHtml(card.text)}</span>`:'<span class="memoryText memoryHidden">?</span>';
    b.addEventListener("click",()=>flip(card.id));grid.appendChild(b);
  });
}
function flip(id){
  if(locked||!$("roundDone").hidden)return;
  const card=cards.find(c=>c.id===id);
  if(!card||card.open||card.matched)return;
  card.open=true;if(card.type==="zh")speakZh(card.text);openCards.push(card);
  if(openCards.length===2){
    moves++;
    const [a,b]=openCards;
    if(a.pair===b.pair&&a.type!==b.type){
      a.matched=b.matched=true;pairsFound++;openCards=[];cfPlayFeedback(true);
      if(pairsFound>=cards.length/2){
        $("roundDoneText").textContent=`${moves} Züge`;
        $("roundDone").hidden=false;
      }
    }else{
      locked=true;
      setTimeout(()=>{a.open=false;b.open=false;openCards=[];locked=false;renderGame();},800);
    }
  }
  renderGame();
}
function start(){
  saveSelection();roundNo=1;
  $("setupCard").hidden=true;$("gameCard").hidden=false;makeRound();
}
$("selectAll").onclick=()=>{topics.forEach(t=>selected.add(t.id));saveSelection();renderPicker();};
$("clearAll").onclick=()=>{selected.clear();saveSelection();renderPicker();};
$("startGame").onclick=start;
$("nextRound").onclick=()=>{roundNo++;makeRound();};
$("changeSelection").onclick=()=>{$("gameCard").hidden=true;$("setupCard").hidden=false;renderPicker();};
$("soundToggle").onclick=()=>{soundOn=!soundOn;localStorage.setItem("cf_memory_global_sound",soundOn?"1":"0");updateSoundButton();};
loadSelection();renderPicker();updateSoundButton();
</script>
</body>
</html>
